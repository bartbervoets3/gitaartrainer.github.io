<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Gitaarhals Oefenkaart</title>


<style>

/* =========================================================
   BASISKLEUREN
========================================================= */

:root {

    --bg: #17120f;

    --wood-dark: #39231d;
    --wood-mid: #513027;
    --wood-light: #634036;

    --gold: #d1aa70;
    --cream: #f7efdf;

    --natural-fill: #e2bd7d;
    --natural-border: #f8ddb0;

    --sharp-fill: #754839;
    --sharp-border: #a66d52;

    --blank-natural: #c59045;
    --blank-sharp: #854936;

}


* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    min-height: 100%;

}


body {

    padding: 20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:

        radial-gradient(

            circle at top,

            #352419,

            var(--bg) 62%

        );

    color: var(--cream);

}


.page {

    width: 100%;

    max-width: 1200px;

    margin: 0 auto;

}



/* =========================================================
   TITEL
========================================================= */

h1 {

    margin: 0;

    color: var(--gold);

    font-size: 25px;

    font-weight: 600;

    text-align: center;

}


.subtitle {

    margin: 5px 0 18px;

    color: #cabba5;

    font-size: 13px;

    text-align: center;

}



/* =========================================================
   BEDIENING
========================================================= */

.toolbar {

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    gap: 8px;

    margin-bottom: 18px;

}


button {

    min-height: 38px;

    padding: 8px 14px;

    border:
        1px solid
        #aa7955;

    border-radius: 8px;

    background:

        linear-gradient(

            #88583b,

            #603a29

        );

    color: #fff4e5;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    transition:

        background 0.15s ease,

        border-color 0.15s ease,

        transform 0.1s ease;

}


button:hover {

    border-color: #d09a6d;

    filter:
        brightness(1.08);

}


button:active {

    transform:
        scale(0.97);

}


button:focus-visible {

    outline:
        2px solid
        #e6bc78;

    outline-offset: 2px;

}


button.active {

    border-color: #e0b774;

    background:

        linear-gradient(

            #ddb87b,

            #b98048

        );

    color: #29170d;

    font-weight: 700;

}



/* =========================================================
   SCROLLCONTAINER
========================================================= */

.fretboard-wrap {

    width: 100%;

    overflow-x: auto;

    padding-bottom: 4px;

    -webkit-overflow-scrolling: touch;

}



/* =========================================================
   GITAAR
========================================================= */

.guitar {

    display: flex;

    width: 100%;

    min-width: 930px;

}



/* =========================================================
   SNAARNAMEN
========================================================= */

.string-names {

    width: 52px;

    flex: 0 0 52px;

    display: grid;

    grid-template-rows:

        repeat(6, 50px);

    color: #e5c796;

    font-size: 13px;

    font-weight: 700;

    text-align: center;

}


.string-name {

    display: flex;

    align-items: center;

    justify-content: center;

}



/* =========================================================
   TOETS
========================================================= */

.fretboard {

    position: relative;

    flex: 1;

    display: grid;

    grid-template-rows:

        repeat(6, 50px);

    border:

        3px solid
        #b88a5a;

    border-radius: 7px;

    background:

        linear-gradient(

            90deg,

            var(--wood-dark) 0%,

            var(--wood-mid) 48%,

            var(--wood-light) 68%,

            var(--wood-dark) 100%

        );

    box-shadow:

        inset 0 0 25px #0009,

        0 5px 14px #0006;

    overflow: hidden;

}



/* =========================================================
   FRETCELLEN
========================================================= */

.cell {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    min-width: 0;

    border-right:

        2px solid
        #aaa090;

}


.cell.open {

    border-right:

        5px solid
        #ddd5c4;

    background:
        #261713;

}



/* =========================================================
   SNAREN
========================================================= */

.cell::after {

    content: "";

    position: absolute;

    z-index: 1;

    left: 0;

    right: 0;

    top: 50%;

    transform:

        translateY(-50%);

    background:
        #d7d1c4;

    box-shadow:

        0 1px 1px
        #000;

}


/* hoge E */

.cell.string-1::after {

    height: 1px;

}


/* B */

.cell.string-2::after {

    height: 1.2px;

}


/* G */

.cell.string-3::after {

    height: 1.4px;

}


/* D */

.cell.string-4::after {

    height: 1.7px;

}


/* A */

.cell.string-5::after {

    height: 2px;

}


/* lage E */

.cell.string-6::after {

    height: 2.3px;

}



/* =========================================================
   NOTEN
========================================================= */

.note {

    position: relative;

    z-index: 3;

    width: 28px;

    height: 28px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex: 0 0 auto;

    border:

        2px solid
        var(--natural-border);

    border-radius: 50%;

    background:

        var(--natural-fill);

    color:
        #25160e;

    font-size: 11px;

    font-weight: 700;

    line-height: 1;

    box-shadow:

        0 2px 4px
        #0007;

}


.note.sharp {

    border-color:

        var(--sharp-border);

    background:

        var(--sharp-fill);

    color:

        #f8efe2;

}



/* =========================================================
   BLANCO INVULCIRKELS
========================================================= */

.note.blank {

    width: 30px;

    height: 30px;

    background:
        #ffffff;

    color:
        transparent;

    box-shadow:
        none;

}


/* hele noot */

.note.blank.natural {

    border:

        2.5px solid
        var(--blank-natural);

}


/* halve noot */

.note.blank.sharp {

    border:

        2.5px solid
        var(--blank-sharp);

    background:
        #ffffff;

}



/* =========================================================
   TOETSINLEG
========================================================= */

.fret-marker {

    position: absolute;

    z-index: 0;

    left: 50%;

    top: 100%;

    width: 13px;

    height: 13px;

    transform:

        translate(
            -50%,
            -50%
        );

    border:

        1px solid
        #ead9b5;

    border-radius:
        50%;

    background:

        radial-gradient(

            circle at 35% 30%,

            #fff9df 0%,

            #d7c59a 48%,

            #9b8057 100%

        );

    box-shadow:

        0 1px 3px
        #0008;

    pointer-events:
        none;

}



/* =========================================================
   FRETNUMMERS
========================================================= */

.labels-row {

    display: flex;

    width: 100%;

    min-width: 930px;

    margin-top: 7px;

}


.labels-spacer {

    width: 52px;

    flex:
        0 0 52px;

}


.fret-labels {

    flex: 1;

    display: grid;

    color:
        #c9aa7e;

    font-size:
        10px;

    text-align:
        center;

}


.fret-label {

    display: flex;

    justify-content:
        center;

    min-width: 0;

}



/* =========================================================
   LEGENDA
========================================================= */

.legend {

    margin-top: 17px;

    color:
        #cdbb9f;

    font-size:
        12px;

    text-align:
        center;

}


.hint {

    margin-top: 7px;

    color:
        #8f806d;

    font-size:
        10px;

    text-align:
        center;

}



/* =========================================================
   ZWART-WITMODUS
========================================================= */

body.bw-mode {

    background:
        #ffffff;

    color:
        #000000;

}


body.bw-mode h1 {

    color:
        #000000;

}


body.bw-mode .subtitle,
body.bw-mode .legend,
body.bw-mode .hint,
body.bw-mode .string-names,
body.bw-mode .fret-labels {

    color:
        #000000;

}


/* witte toets */

body.bw-mode .fretboard {

    border:

        1.5px solid
        #000000;

    background:
        #ffffff;

    box-shadow:
        none;

}


/* frets */

body.bw-mode .cell {

    border-right:

        1.2px solid
        #555555;

}


/* topkam */

body.bw-mode .cell.open {

    border-right:

        3px solid
        #000000;

    background:
        #ffffff;

}


/* snaren */

body.bw-mode .cell::after {

    background:
        #000000;

    box-shadow:
        none;

}


body.bw-mode .cell.string-1::after {

    height: 0.7px;

}


body.bw-mode .cell.string-2::after {

    height: 0.9px;

}


body.bw-mode .cell.string-3::after {

    height: 1.1px;

}


body.bw-mode .cell.string-4::after {

    height: 1.4px;

}


body.bw-mode .cell.string-5::after {

    height: 1.7px;

}


body.bw-mode .cell.string-6::after {

    height: 2px;

}



/* hele noot */

body.bw-mode .note {

    border:

        1.8px solid
        #000000;

    background:
        #ffffff;

    color:
        #000000;

    box-shadow:
        none;

}


/* halve noot */

body.bw-mode .note.sharp {

    border:

        3px double
        #000000;

    background:
        #f1f1f1;

    color:
        #000000;

    box-shadow:
        none;

}


/* blanco hele noot */

body.bw-mode .note.blank.natural {

    border:

        1.8px solid
        #000000;

    background:
        #ffffff;

}


/* blanco halve noot */

body.bw-mode .note.blank.sharp {

    border:

        3px double
        #000000;

    background:
        #ffffff;

}


/* toetsinleg */

body.bw-mode .fret-marker {

    width: 10px;

    height: 10px;

    border:
        none;

    background:
        #000000;

    box-shadow:
        none;

}



/* =========================================================
   BEDIENKNOPPEN ZWART-WIT
========================================================= */

body.bw-mode .toolbar button {

    border:

        1.5px solid
        #000000;

    background:
        #ffffff;

    color:
        #000000;

    box-shadow:
        none;

    filter:
        none;

}


body.bw-mode .toolbar button.active {

    border-color:
        #000000;

    background:
        #000000;

    color:
        #ffffff;

}


body.bw-mode .toolbar button:hover {

    background:
        #eeeeee;

    color:
        #000000;

    filter:
        none;

}


body.bw-mode .toolbar button.active:hover {

    background:
        #000000;

    color:
        #ffffff;

}



/* =========================================================
   MOBIEL
========================================================= */

@media (
    max-width: 600px
) {

    body {

        padding:
            10px;

    }


    h1 {

        font-size:
            21px;

    }


    .subtitle {

        font-size:
            12px;

    }


    button {

        min-height:
            40px;

        padding:

            8px 11px;

    }

}



/* =========================================================
   PRINTLAYOUT
========================================================= */

@media print {

    @page {

        size:
            A4 landscape;

        margin:
            9mm;

    }


    html,
    body {

        background:
            #ffffff !important;

    }


    body {

        margin:
            0;

        padding:
            0;

    }


    .page {

        max-width:
            none;

    }


    /*
       Knoppen niet mee afdrukken
    */

    .toolbar,
    .hint {

        display:
            none !important;

    }


    .fretboard-wrap {

        overflow:
            visible;

    }


    .guitar,
    .labels-row {

        min-width:
            0;

    }


    .fretboard {

        break-inside:
            avoid;

        print-color-adjust:
            exact;

        -webkit-print-color-adjust:
            exact;

    }


    .note,
    .fret-marker {

        print-color-adjust:
            exact;

        -webkit-print-color-adjust:
            exact;

    }


    /* zwart-wit print */

    body.bw-mode h1,
    body.bw-mode .subtitle,
    body.bw-mode .legend,
    body.bw-mode .string-names,
    body.bw-mode .fret-labels {

        color:
            #000000 !important;

    }


    body.bw-mode .fretboard {

        background:
            #ffffff !important;

        border:

            1.5px solid
            #000000 !important;

        box-shadow:
            none !important;

    }


    body.bw-mode .cell {

        border-right-color:

            #555555 !important;

    }


    body.bw-mode .cell.open {

        background:
            #ffffff !important;

        border-right:

            3px solid
            #000000 !important;

    }


    body.bw-mode .cell::after {

        background:
            #000000 !important;

        box-shadow:
            none !important;

    }


    body.bw-mode .note {

        background:
            #ffffff !important;

        color:
            #000000 !important;

        border:

            1.8px solid
            #000000 !important;

        box-shadow:
            none !important;

    }


    body.bw-mode .note.sharp {

        background:
            #f1f1f1 !important;

        color:
            #000000 !important;

        border:

            3px double
            #000000 !important;

    }


    body.bw-mode .note.blank.natural {

        background:
            #ffffff !important;

        border:

            1.8px solid
            #000000 !important;

    }


    body.bw-mode .note.blank.sharp {

        background:
            #ffffff !important;

        border:

            3px double
            #000000 !important;

    }


    body.bw-mode .fret-marker {

        background:
            #000000 !important;

        border:
            none !important;

    }

}

</style>

</head>



<body>


<main class="page">


    <h1>
        Gitaarhals Oefenkaart
    </h1>


    <div class="subtitle">

        Standaardstemming E – A – D – G – B – E · fret 0–12

    </div>



    <!-- =================================================
         BEDIENING
    ================================================== -->

    <div
        class="toolbar"
        aria-label="Oefenkaartinstellingen"
    >


        <button
            type="button"
            data-mode="all"
            class="active"
        >

            Alle noten

        </button>



        <button
            type="button"
            data-mode="natural"
        >

            Hele noten

        </button>



        <button
            type="button"
            data-mode="blank"
        >

            Blanco

        </button>



        <button
            type="button"
            id="bwButton"
            aria-pressed="false"
        >

            ◐ Zwart-wit

        </button>



        <button
            type="button"
            id="printButton"
        >

            ⎙ Afdrukken

        </button>



        <button
            type="button"
            id="backButton"
        >

            ← Terug

        </button>


    </div>



    <!-- =================================================
         GITAARHALS
    ================================================== -->

    <div class="fretboard-wrap">


        <div class="guitar">


            <div
                id="stringNames"
                class="string-names"
            ></div>


            <div
                id="fretboard"
                class="fretboard"
            ></div>


        </div>



        <!-- FRETNUMMERS -->

        <div class="labels-row">


            <div
                class="labels-spacer"
            ></div>


            <div
                id="fretLabels"
                class="fret-labels"
            ></div>


        </div>


    </div>



    <!-- =================================================
         LEGENDA
    ================================================== -->

    <div
        id="legend"
        class="legend"
        aria-live="polite"
    >

        Lichte bolletjes = hele noten ·
        donkere bolletjes = halve tonen

    </div>


    <div class="hint">

        Op kleinere schermen kun je horizontaal over de oefenkaart schuiven.

    </div>


</main>



<script>

"use strict";


/* =========================================================
   STEMMING
========================================================= */

const tuning = [

    {
        label: "E⁶",
        midi: 40
    },

    {
        label: "A",
        midi: 45
    },

    {
        label: "D",
        midi: 50
    },

    {
        label: "G",
        midi: 55
    },

    {
        label: "B",
        midi: 59
    },

    {
        label: "E¹",
        midi: 64
    }

];



const noteNames = [

    "C",
    "C♯",

    "D",
    "D♯",

    "E",

    "F",
    "F♯",

    "G",
    "G♯",

    "A",
    "A♯",

    "B"

];



const singleMarkerFrets = [

    3,
    5,
    7,
    9

];


const doubleMarkerFret =
    12;



/* =========================================================
   DOM
========================================================= */

const board =
    document.getElementById(
        "fretboard"
    );


const stringNames =
    document.getElementById(
        "stringNames"
    );


const fretLabels =
    document.getElementById(
        "fretLabels"
    );


const legend =
    document.getElementById(
        "legend"
    );


const bwButton =
    document.getElementById(
        "bwButton"
    );


const printButton =
    document.getElementById(
        "printButton"
    );


const backButton =
    document.getElementById(
        "backButton"
    );



let mode =
    "all";


let blackAndWhite =
    false;



/* =========================================================
   REALISTISCHE FRETVERDELING

   x = 1 - 2^(-n / 12)
========================================================= */

function calculateFretColumns() {


    const widths =
        [];


    let previous =
        0;



    for (

        let fret = 1;

        fret <= 12;

        fret++

    ) {


        const position =

            1 -

            Math.pow(

                2,

                -fret / 12

            );



        widths.push(

            position -
            previous

        );


        previous =
            position;

    }



    const maximum =

        Math.max(

            ...widths

        );



    const ratios =

        widths.map(

            width =>

                width /
                maximum

        );



    return [

        "48px",

        ...ratios.map(

            ratio =>

                ratio.toFixed(5)
                +
                "fr"

        )

    ];

}



/* =========================================================
   GRID
========================================================= */

function setupGrid() {


    const grid =

        calculateFretColumns()
            .join(" ");



    board.style
        .gridTemplateColumns =
        grid;



    fretLabels.style
        .gridTemplateColumns =
        grid;

}



/* =========================================================
   SNAARNAMEN
========================================================= */

function drawStringNames() {


    stringNames.innerHTML =
        "";



    [...tuning]

        .reverse()

        .forEach(

            string => {


                const label =

                    document
                        .createElement(
                            "div"
                        );



                label.className =
                    "string-name";



                label.textContent =
                    string.label;



                stringNames
                    .appendChild(
                        label
                    );

            }

        );

}



/* =========================================================
   TOETSINLEG
========================================================= */

function addMarker(

    cell,

    fret,

    stringIndex

) {


    /*
       enkele inleg:
       3, 5, 7, 9
    */

    if (

        singleMarkerFrets
            .includes(
                fret
            )

        &&

        stringIndex === 2

    ) {


        const marker =

            document
                .createElement(
                    "span"
                );



        marker.className =
            "fret-marker";



        cell.appendChild(
            marker
        );

    }



    /*
       dubbele inleg:
       fret 12
    */

    if (

        fret ===
            doubleMarkerFret

        &&

        (

            stringIndex === 1

            ||

            stringIndex === 3

        )

    ) {


        const marker =

            document
                .createElement(
                    "span"
                );



        marker.className =
            "fret-marker";



        cell.appendChild(
            marker
        );

    }

}



/* =========================================================
   NOOT MAKEN
========================================================= */

function createNote(

    noteName,

    isSharp

) {


    const note =

        document
            .createElement(
                "div"
            );



    /* BLANCO */

    if (

        mode ===
            "blank"

    ) {


        note.className =

            "note blank "

            +

            (

                isSharp

                    ? "sharp"

                    : "natural"

            );



        note.textContent =
            "";



        return note;

    }



    /* NORMAAL */

    note.className =

        "note"

        +

        (

            isSharp

                ? " sharp"

                : ""

        );



    note.textContent =
        noteName;



    return note;

}



/* =========================================================
   GITAARHALS
========================================================= */

function drawFretboard() {


    board.innerHTML =
        "";



    const visualTuning =

        [...tuning]
            .reverse();



    visualTuning
        .forEach(

            (

                string,

                stringIndex

            ) => {



                for (

                    let fret = 0;

                    fret <= 12;

                    fret++

                ) {



                    const cell =

                        document
                            .createElement(
                                "div"
                            );



                    cell.className =

                        "cell "

                        +

                        "string-"

                        +

                        (

                            stringIndex
                            + 1

                        )

                        +

                        (

                            fret === 0

                                ? " open"

                                : ""

                        );



                    const noteName =

                        noteNames[

                            (

                                string.midi

                                +

                                fret

                            )

                            %

                            12

                        ];



                    const isSharp =

                        noteName
                            .includes(
                                "♯"
                            );



                    addMarker(

                        cell,

                        fret,

                        stringIndex

                    );



                    /* ALLE NOTEN */

                    if (

                        mode ===
                            "all"

                    ) {


                        cell.appendChild(

                            createNote(

                                noteName,

                                isSharp

                            )

                        );

                    }



                    /* HELE NOTEN */

                    else if (

                        mode ===
                            "natural"

                        &&

                        !isSharp

                    ) {


                        cell.appendChild(

                            createNote(

                                noteName,

                                false

                            )

                        );

                    }



                    /* BLANCO */

                    else if (

                        mode ===
                            "blank"

                    ) {


                        cell.appendChild(

                            createNote(

                                noteName,

                                isSharp

                            )

                        );

                    }



                    board.appendChild(
                        cell
                    );

                }

            }

        );

}



/* =========================================================
   FRETNUMMERS
========================================================= */

function drawFretLabels() {


    fretLabels.innerHTML =
        "";



    for (

        let fret = 0;

        fret <= 12;

        fret++

    ) {


        const label =

            document
                .createElement(
                    "div"
                );



        label.className =
            "fret-label";



        label.textContent =

            fret === 0

                ? "Open"

                : fret;



        fretLabels
            .appendChild(
                label
            );

    }

}



/* =========================================================
   LEGENDA
========================================================= */

function updateLegend() {


    if (

        mode === "all"

        &&

        !blackAndWhite

    ) {


        legend.textContent =

            "Lichte bolletjes = hele noten · " +

            "donkere bolletjes = halve tonen";

    }



    else if (

        mode === "all"

        &&

        blackAndWhite

    ) {


        legend.textContent =

            "Enkele rand = hele noot · " +

            "dubbele rand = halve noot";

    }



    else if (

        mode === "natural"

    ) {


        legend.textContent =

            "Oefenkaart met alleen de hele noten";

    }



    else if (

        mode === "blank"

        &&

        !blackAndWhite

    ) {


        legend.textContent =

            "Vul de juiste noot in · " +

            "gouden rand = hele noot · " +

            "bruine rand = halve noot";

    }



    else if (

        mode === "blank"

        &&

        blackAndWhite

    ) {


        legend.textContent =

            "Vul de juiste noot in · " +

            "enkele rand = hele noot · " +

            "dubbele rand = halve noot";

    }

}



/* =========================================================
   MODUSKNOPPEN
========================================================= */

document
    .querySelectorAll(
        "[data-mode]"
    )
    .forEach(

        button => {


            button.addEventListener(

                "click",

                () => {


                    mode =

                        button
                            .dataset
                            .mode;



                    document

                        .querySelectorAll(
                            "[data-mode]"
                        )

                        .forEach(

                            otherButton => {


                                otherButton
                                    .classList
                                    .toggle(

                                        "active",

                                        otherButton
                                        ===
                                        button

                                    );

                            }

                        );



                    drawFretboard();


                    updateLegend();

                }

            );

        }

    );



/* =========================================================
   ZWART-WIT
========================================================= */

bwButton
    .addEventListener(

        "click",

        () => {


            blackAndWhite =

                !blackAndWhite;



            document

                .body

                .classList

                .toggle(

                    "bw-mode",

                    blackAndWhite

                );



            bwButton

                .setAttribute(

                    "aria-pressed",

                    String(
                        blackAndWhite
                    )

                );



            bwButton.textContent =

                blackAndWhite

                    ? "◐ Kleur"

                    : "◐ Zwart-wit";



            updateLegend();

        }

    );



/* =========================================================
   AFDRUKKEN

   KODULAR:
      stuur PRINT_PAGE

   OUDERE APP INVENTOR BRIDGE:
      stuur PRINT_PAGE

   NORMALE BROWSER:
      window.print()
========================================================= */

printButton
    .addEventListener(

        "click",

        () => {


            /* =============================================
               KODULAR WEBVIEWER
            ============================================= */

            if (

                typeof window.Kodular
                    !== "undefined"

                &&

                typeof window.Kodular
                    .setWebViewString
                    === "function"

            ) {


                window.Kodular
                    .setWebViewString(

                        "PRINT_PAGE"

                    );


                return;

            }



            /* =============================================
               FALLBACK OUDERE WEBVIEW
            ============================================= */

            if (

                typeof window.AppInventor
                    !== "undefined"

                &&

                typeof window.AppInventor
                    .setWebViewString
                    === "function"

            ) {


                window.AppInventor
                    .setWebViewString(

                        "PRINT_PAGE"

                    );


                return;

            }



            /* =============================================
               NORMALE BROWSER / PC
            ============================================= */

            window.print();

        }

    );



/* =========================================================
   TERUG
   KODULAR:
      stuur BACK_TO_INDEX
   OUDERE APP INVENTOR BRIDGE:
      stuur BACK_TO_INDEX
   NORMALE BROWSER:
      ga naar index.html
========================================================= */
backButton
    .addEventListener(
        "click",
        () => {
            if (
                typeof window.Kodular !== "undefined"
                &&
                typeof window.Kodular.setWebViewString === "function"
            ) {
                window.Kodular.setWebViewString(
                    "BACK_TO_INDEX"
                );
                return;
            }

            if (
                typeof window.AppInventor !== "undefined"
                &&
                typeof window.AppInventor.setWebViewString === "function"
            ) {
                window.AppInventor.setWebViewString(
                    "BACK_TO_INDEX"
                );
                return;
            }

            window.location.href = "index.html";
        }
    );

/* =========================================================
   INITIALISATIE
========================================================= */

setupGrid();

drawStringNames();

drawFretLabels();

drawFretboard();

updateLegend();


</script>
