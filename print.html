<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gitaarhals Oefenkaart</title>

<style>
:root {
    --wood-dark: #39231d;
    --wood-middle: #513027;
    --wood-light: #634036;
    --spruce: #d1aa70;
    --cream: #f7efdf;
    --natural-fill: #e2bd7d;
    --natural-border: #f8ddb0;
    --sharp-fill: #754839;
    --sharp-border: #a66d52;
    --blank-natural-border: #c59045;
    --blank-sharp-border: #854936;
}

* {
    box-sizing: border-box;
}

html,
body {
    min-height: 100%;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, Helvetica, sans-serif;
    background: #17120f;
    color: var(--cream);
}

.page {
    max-width: 1200px;
    margin: 0 auto;
}

/* ==================================================
   TITEL
================================================== */

h1 {
    margin: 0;
    color: var(--spruce);
    font-size: 25px;
    font-weight: 600;
    text-align: center;
}

.subtitle {
    margin: 5px 0 20px;
    color: #cabba5;
    font-size: 13px;
    text-align: center;
}

/* ==================================================
   BEDIENING
================================================== */

.toolbar {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
}

button {
    min-height: 38px;
    padding: 8px 14px;
    border: 1px solid #aa7955;
    border-radius: 8px;

    background:
        linear-gradient(
            #88583b,
            #603a29
        );

    color: #fff4e5;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.1);
}

button:focus-visible {
    outline: 3px solid #e6bc78;
    outline-offset: 2px;
}

button.active {
    border-color: #e0b774;

    background:
        linear-gradient(
            #ddb87b,
            #b98048
        );

    color: #29170d;
    font-weight: 700;
}

/* ==================================================
   SCROLLCONTAINER
================================================== */

.fretboard-wrap {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 5px;
}

/* ==================================================
   GITAARHALS EN SNAARNAMEN
================================================== */

.guitar {
    display: flex;
    width: 100%;
    min-width: 940px;
}

.string-names {
    width: 52px;
    flex: 0 0 52px;

    display: grid;

    grid-template-rows:
        repeat(6, 50px);

    color: #e5c796;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
}

.string-name {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ==================================================
   GITAARHALS
================================================== */

.fretboard {
    position: relative;
    flex: 1;

    display: grid;

    grid-template-rows:
        repeat(6, 50px);

    border: 3px solid #b88a5a;
    border-radius: 6px;

    background:
        linear-gradient(
            90deg,
            var(--wood-dark) 0%,
            var(--wood-middle) 48%,
            var(--wood-light) 68%,
            var(--wood-dark) 100%
        );

    box-shadow:
        inset 0 0 25px #0009,
        0 5px 14px #0006;

    overflow: hidden;
}

/* ==================================================
   FRETCELLEN
================================================== */

.cell {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    min-width: 0;

    border-right:
        2px solid #aaa090;
}

.cell.open {
    border-right:
        5px solid #ddd5c4;

    background: #261713;
}

/* ==================================================
   SNAREN
================================================== */

.cell::after {
    content: "";

    position: absolute;
    z-index: 1;

    left: 0;
    right: 0;
    top: 50%;

    height: 1px;

    transform:
        translateY(-50%);

    background: #d7d1c4;

    box-shadow:
        0 1px 1px #000;
}

.cell.string-1::after {
    height: 1px;
}

.cell.string-2::after {
    height: 1.2px;
}

.cell.string-3::after {
    height: 1.4px;
}

.cell.string-4::after {
    height: 1.7px;
}

.cell.string-5::after {
    height: 2px;
}

.cell.string-6::after {
    height: 2.3px;
}

/* ==================================================
   NOTEN
================================================== */

.note {
    position: relative;
    z-index: 3;

    width: 28px;
    height: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex: 0 0 auto;

    border:
        2px solid
        var(--natural-border);

    border-radius: 50%;

    background:
        var(--natural-fill);

    color: #25160e;

    font-size: 11px;
    font-weight: 700;
    line-height: 1;

    box-shadow:
        0 2px 4px #0007;
}

.note.sharp {
    border-color:
        var(--sharp-border);

    background:
        var(--sharp-fill);

    color:
        #f8efe2;
}
