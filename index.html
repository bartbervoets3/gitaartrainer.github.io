function applyLanguage(){document.documentElement.lang=lang;u.nl.classList.toggle('active',lang==='nl');u.en.classList.toggle('active',lang==='en');u.title.textContent=t('title');u.transport.dataset.label=t('controls');u.settingsTitle.textContent=t('settings');u.closeSettings.setAttribute('aria-label',t('close'));u.printCard.title=t('printCard');u.printCard.setAttribute('aria-label',t('printCard'));u.scoreLabel.textContent=t('score');u.triesLabel.textContent=t('tries');u.roundsLabel.textContent=t('rounds');u.modeLabel.textContent=t('mode');u.wholeLabel.textContent=t('whole');u.sharpLabel.textContent=t('sharp');u.mapLabel.textContent=t('map');u.roundLabel.textContent=t('round');u.timerLabel.textContent=t('timer');u.timeLabel.textContent=t('time');u.map.options[0].text=t('hide');u.map.options[1].text=t('all');u.map.options[2].text=t('natural');u.map.options[3].text=t('sharps');updateTransport();updateErrorButtons();u.timerToggle.textContent=timerOn?t('on'):t('off');if(!running&&!active)u.status.textContent=t('press')}
function updateTransport(){if(running){u.start.textContent=timerOn?'⏸ '+t('pause'):'▶ '+t('next');u.start.classList.toggle('stop',timerOn)}else if(active&&tries<total){u.start.textContent='▶ '+t('resume');u.start.classList.remove('stop')}else{u.start.textContent='▶ '+t('start');u.start.classList.remove('stop')}u.reset.textContent='↻ '+t('reset')}function pool(){if(practiceMode)return practicePool;return u.mode.checked?positions:positions.filter(p=>naturals.has(p.note))}function clearDot(){document.querySelectorAll('.dot').forEach(e=>e.remove())}function mapVisible(){return u.map.value!=='none'}
function renderMap(){document.querySelectorAll('.mapNote').forEach(e=>e.remove());let m=u.map.value;if(m!=='none')positions.filter(p=>!p.open).forEach(p=>{let sh=p.note.includes('#');if(m==='all'||(m==='natural'&&!sh)||(m==='sharp'&&sh)){let e=document.createElement('span');e.className='mapNote'+(sh?' sharp':'');e.textContent=p.note;p.element.append(e)}});let d=document.querySelector('.dot');if(d)d.style.display=m==='none'?'':'none';if(mapVisible()){stopTimer();u.status.textContent=t('card')}else if(running&&!locked)startTimer();renderErrors()}
function uniqueErrors(){let m=new Map();mistakes.forEach(p=>m.set(p.stringNo+'-'+p.fret,p));return [...m.values()]}function renderErrors(){document.querySelectorAll('.mistake').forEach(e=>e.remove());let list=uniqueErrors();if(errorsVisible)list.forEach(p=>{let e=document.createElement('span');e.className='mistake'+(p.open?' open':'');p.element.append(e)});updateErrorButtons()}function updateErrorButtons(){let n=uniqueErrors().length;u.showErrors.textContent=(errorsVisible?t('hideErrors'):t('show'))+` (${n})`;u.practiceErrors.textContent='↻ '+t('practice')+` (${n})`;u.practiceErrors.disabled=n===0}function updateProgress(){u.progress.style.width=(Math.min(tries,total)/Math.max(1,total)*100)+'%'}
function stopTimer(){clearInterval(timerId);timerId=null;deadline=0;u.timer.classList.remove('on')}function startTimer(){if(!timerOn||!running||locked||mapVisible())return;stopTimer();let dur=Number(u.seconds.value)*1000;deadline=performance.now()+dur;u.timer.classList.add('on');timerId=setInterval(()=>{let left=Math.max(0,deadline-performance.now());u.timerBar.style.width=(left/dur*100)+'%';u.timerText.textContent=(left/1000).toFixed(1)+' s';if(left<=0){stopTimer();timeout()}},50)}function choose(a){if(!a.length)return null;let p;do{p=a[Math.floor(Math.random()*a.length)]}while(a.length>1&&active===p);return p}
function nextQuestion(){if(!running)return;if(tries>=total){finish();return}clearTimeout(nextId);stopTimer();clearDot();locked=false;active=choose(pool());if(!active)return;let d=document.createElement('button');d.className='dot'+(active.open?' open':'');d.onclick=()=>tone(active.midi,active.stringNo);active.element.append(d);if(mapVisible()){d.style.display='none';u.status.textContent=t('card')}else{u.status.textContent='';tone(active.midi,active.stringNo);startTimer()}}function recordError(){if(active)mistakes.push(active);renderErrors()}
function answer(n){if(!running||locked||!active||mapVisible())return;if(!u.mode.checked&&!practiceMode&&n.includes('#'))return;locked=true;stopTimer();tries++;u.tries.textContent=tries;let d=active.element.querySelector('.dot'),ok=n===active.note;if(ok){score++;u.score.textContent=score;if(d)d.classList.add('good');good();u.status.textContent='✓ '+t('correct')+' · '+n}else{if(d)d.classList.add('bad');recordError();bad();u.status.textContent='✗ '+t('correctNote')+': '+active.note}updateProgress();if(tries>=total){nextId=setTimeout(finish,ok?650:950)}else if(timerOn){nextId=setTimeout(nextQuestion,ok?650:950)}else{u.status.textContent+=(lang==='nl'?' · druk Volgende':' · press Next');updateTransport()}}function timeout(){if(locked||!active)return;locked=true;tries++;u.tries.textContent=tries;let d=active.element.querySelector('.dot');if(d)d.classList.add('bad');recordError();bad();u.status.textContent=t('timeUp')+' · '+t('correctNote')+': '+active.note;updateProgress();nextId=setTimeout(()=>tries>=total?finish():nextQuestion(),1050)}
function finish(){running=false;stopTimer();clearTimeout(nextId);u.progress.style.width='100%';rounds++;u.rounds.textContent=rounds;const passed=score/Math.max(1,total)>=0.6;roundJingle(passed);u.status.textContent=(practiceMode?t('practiceDone'):t('done'))+`: ${score} / ${total}`;updateTransport()}function resetState(clear=true){clearTimeout(nextId);stopTimer();clearDot();score=tries=0;u.score.textContent=u.tries.textContent='0';active=null;locked=false;practiceMode=false;practicePool=[];if(clear){mistakes=[];errorsVisible=false}total=normRound();u.round.value=total;u.progress.style.width='0%';renderErrors();updateAnswers()}function newRound(){resetState(true);running=true;u.settings.classList.remove('open');u.gear.setAttribute('aria-expanded','false');updateTransport();nextQuestion()}function startStop(){if(running){if(timerOn){running=false;stopTimer();clearTimeout(nextId);u.status.textContent=t('stopped');updateTransport();return}clearTimeout(nextId);nextQuestion();updateTransport();return}if(!active||tries>=total){newRound();return}running=true;locked=false;updateTransport();if(timerOn)startTimer();else nextQuestion()}function practiceErrors(){let e=uniqueErrors();if(!e.length)return;clearTimeout(nextId);stopTimer();clearDot();practiceMode=true;practicePool=e;errorsVisible=false;score=tries=0;u.score.textContent=u.tries.textContent='0';total=e.length;active=null;locked=false;running=true;u.map.value='none';u.progress.style.width='0%';renderMap();updateAnswers();renderErrors();updateTransport();nextQuestion()}
u.start.onclick=startStop;u.reset.onclick=newRound;u.gear.onclick=()=>{let o=u.settings.classList.toggle('open');u.gear.setAttribute('aria-expanded',String(o))};u.closeSettings.onclick=()=>{u.settings.classList.remove('open');u.gear.setAttribute('aria-expanded','false')};u.showErrors.onclick=()=>{errorsVisible=!errorsVisible;renderErrors()};u.practiceErrors.onclick=practiceErrors;u.mode.onchange=()=>{updateAnswers();if(running&&!locked)nextQuestion()};u.map.onchange=renderMap;u.round.oninput=u.round.onchange=()=>{u.round.value=normRound();if(!practiceMode){total=Math.max(tries+1,normRound());u.round.value=total;updateProgress()}};u.timerToggle.onclick=()=>{timerOn=!timerOn;u.timerToggle.textContent=timerOn?t('on'):t('off');if(timerOn){if(running&&!locked)startTimer()}else{stopTimer();clearTimeout(nextId)}updateTransport()};u.seconds.oninput=u.seconds.onchange=()=>{if(timerOn)startTimer()};u.nl.onclick=()=>{lang='nl';applyLanguage()};u.en.onclick=()=>{lang='en';applyLanguage()};u.printCard.onclick=()=>{window.location.href='print.html'};u.rounds.textContent=rounds;buildNeck();buildAnswers();applyLanguage();renderErrors();updateProgress();updateTransport();
</script></body></html>
