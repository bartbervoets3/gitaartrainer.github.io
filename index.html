<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gitaar Notentrainer</title>

<style>
:root {
    color-scheme: dark;
    --bg: #120d0a;
    --panel: #201713;
    --wood: #74432d;
    --light: #edcc94;
    --rose: #38231e;
    --green: #4f9c65;
    --red: #b94c43;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(
            circle at top,
            #342319,
            var(--bg) 60%
        );
    color: #f7eee3;
    font: 14px system-ui, sans-serif;
}

main {
    max-width: 900px;
    margin: auto;
    padding:
        max(10px, env(safe-area-inset-top))
        8px
        16px;
}

.top,
.opts {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
}

.title {
    font-size: 20px;
    font-weight: 800;
    margin-right: auto;
}

.clef {
    font: 34px serif;
    color: white;
}

button,
select,
input {
    min-height: 38px;
    border-radius: 8px;
    border: 1px solid #a9704b;
    background:
        linear-gradient(
            #975c3b,
            #74432d
        );
    color: #fff0dd;
    font-weight: 700;
    padding: 6px 9px;
}

button.active {
    background:
        linear-gradient(
            #edcc94,
            #d1a363
        );
    color: #28180e;
}

.stats {
    padding: 7px;
    background: #3b2921;
    border-radius: 8px;
}

.opts {
    margin: 7px 0;
}

.opts label {
    font-size: 11px;
    color: #c9b69e;
}

.opts input {
    width: 65px;
}

.status {
    text-align: center;
    min-height: 28px;
}

/* TIMER + PROGRESS */

.timer,
.progress {
    height: 9px;
    border-radius: 9px;
    background: #33251e;
    overflow: hidden;
    margin: 5px auto;
    max-width: 760px;
}

.timer {
    display: none;
    height: 22px;
    position: relative;
}

.timer.on {
    display: block;
}

.timer > i,
.progress > i {
    display: block;
    height: 100%;
    width: 0;
    background:
        linear-gradient(
            90deg,
            #4b8f5e,
            #7eb985
        );
}

.timer > b {
    position: absolute;
    inset: 0;
    text-align: center;
    font-size: 11px;
    line-height: 20px;
}

/* GUITAR NECK */

.neck {
    --label: 22px;

    margin: 7px auto;
    width: 98%;

    background:
        linear-gradient(
            90deg,
            #56361e,
            #ae7947,
            #5b391f
        );

    padding: 3px 2px;
    border-radius: 6px;
}

.nums,
.string {
    display: grid;

    grid-template-columns:
        var(--label)
        var(--frets);

    align-items: center;
}

.nums {
    height: 13px;
    font-size: 6px;
    color: #28170b;
    text-align: center;
}

.string,
.cell {
    height: 24px;
}

/*
 * BELANGRIJK:
 * iedere snaarrij is opnieuw de positioning context.
 */
.string {
    position: relative;
}

.label,
.cell {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.label {
    color: #28170b;
    font-weight: 900;
    font-size: 8px;
}

.cell {
    border-right: 1px solid #ddd;
}

.cell.first {
    border-left: 4px solid #f1e8d4;
}

/* HERSTELDE SNAREN */

.line {
    position: absolute;

    left: var(--label);
    right: 0;
    top: 50%;

    height: max(var(--sw), 1.25px);

    transform: translateY(-50%);

    background: var(--sc);

    border-radius: 99px;

    box-shadow:
        0 1px 1px #2b1a0d,
        0 -1px #ffffff55;

    z-index: 3;

    pointer-events: none;
}

/* NOTE LABELS */

.note {
    position: absolute;
    z-index: 5;

    padding: 2px;

    min-width: 14px;

    text-align: center;

    background: #f6e7cb;
    color: #24170d;

    border: 1px solid #8b673f;
    border-radius: 3px;

    font-size: 6px;
    font-weight: 900;
}

.note.sharp {
    background: #352116;
    color: #fff;
}

/* QUIZ DOT */

.dot,
.mistake {
    position: relative;

    z-index: 10;

    width: 18px;
    height: 18px;

    padding: 0;

    border-radius: 50%;
}

.dot {
    background: #111;
    border: 2px solid #050505;
}

.dot.open {
    position: absolute;

    left: 0;
    top: 50%;

    transform: translate(-50%, -50%);
}

.dot.good {
    background: var(--green);
}

.dot.bad {
    background: var(--red);
}

/* ERROR MARKERS */

.mistake {
    position: absolute;

    width: 10px;
    height: 10px;

    background: var(--red);

    border: 1px solid #efaea5;
}

/* ANSWERS */

.answers {
    display: grid;

    grid-template-columns:
        repeat(6, 1fr);

    gap: 5px;

    margin-top: 8px;
}

.answers button {
    min-width: 0;

    background:
        linear-gradient(
            #f0d39e,
            #cf9c5d
        );

    color: #28180e;
}

.answers button.sharp {
    background:
        linear-gradient(
            #624137,
            #35231e
        );

    color: #fff;
}

.small {
    font-size: 8px;
    opacity: .65;
}

.credits {
    text-align: center;

    color: #c0ad96;

    font-size: 10px;

    margin-top: 12px;
}

.credits a {
    color: #edcc94;
}

/* LANGUAGE */

.lang {
    display: flex;

    gap: 2px;

    padding: 2px;

    background: #261714;

    border-radius: 8px;
}

.lang button {
    min-width: 34px;

    padding: 4px;

    background: transparent;

    border-color: transparent;
}

.lang button.active {
    background:
        linear-gradient(
            #edcc94,
            #d1a363
        );

    color: #28180e;
}

.settingsToggle {
    display: none;
}

/* DESKTOP */

@media (min-width: 701px) {

    .neck {
        --label: 38px;

        width: 760px;
    }

    .string,
    .cell {
        height: 30px;
    }

    .nums {
        height: 18px;
        font-size: 9px;
    }

    .label {
        font-size: 11px;
    }

    .note {
        font-size: 8px;
    }

    .answers {
        display: flex;
        justify-content: center;
    }

    .answers button {
        min-width: 53px;
    }
}

/* LANDSCAPE SMARTPHONE */

@media (max-height: 520px) and (orientation: landscape) {

    body {
        overflow: hidden;
    }

    main {
        height: 100dvh;

        padding: 3px 7px;

        overflow: hidden;
    }

    .top {
        flex-wrap: nowrap;
        gap: 3px;
    }

    .title {
        font-size: 13px;
    }

    .clef {
        font-size: 23px;
    }

    .lang {
        padding: 1px;
    }

    .lang button {
        min-width: 26px;
        min-height: 25px;

        padding: 1px 3px;

        font-size: 9px;
    }

    .stats {
        padding: 3px 5px;
        font-size: 9px;
    }

    .top > button {
        min-height: 27px;

        padding: 2px 5px;

        font-size: 9px;
    }

    /*
     * Moeilijkheidskeuze wordt in landscape
     * uit de primaire werkbalk gehouden.
     */
    .top #natural,
    .top #all {
        display: none;
    }

    .settingsToggle {
        display: block !important;

        min-width: 29px;
        max-width: 29px;
    }

    /* INSTELLINGEN-POPUP */

    .opts {
        display: none;

        position: absolute;

        z-index: 100;

        top: 34px;
        right: 6px;

        width: min(390px, 94vw);

        padding: 7px;

        background: #261a16f7;

        border: 1px solid #8b604b;
        border-radius: 9px;

        box-shadow:
            0 8px 22px #000b;
    }

    .opts.landscape-open {
        display: grid;

        grid-template-columns:
            1fr 1fr;

        gap: 5px;
    }

    .status {
        min-height: 16px;
        font-size: 9px;
    }

    .timer {
        height: 13px;
        margin: 1px auto;
    }

    .timer b {
        font-size: 7px;
        line-height: 11px;
    }

    .progress {
        height: 4px;

        margin: 2px auto;
    }

    /* Compacte hals */

    .neck {
        width: min(94%, 720px);

        padding: 1px;
    }

    .nums {
        height: 9px;

        font-size: 5px;
    }

    .string,
    .cell {
        height: 18px;
    }

    .label {
        font-size: 6px;
    }

    .note {
        min-width: 10px;

        padding: 1px;

        font-size: 5px;
    }

    .dot {
        width: 15px;
        height: 15px;
    }

    .dot.open {
        width: 17px;
        height: 17px;
    }

    .mistake {
        width: 8px;
        height: 8px;
    }

    /* Alle antwoordknoppen op één rij */

    .answers {
        grid-template-columns:
            repeat(12, 1fr);

        gap: 2px;

        margin-top: 2px;
    }

    .answers button {
        min-height: 27px;

        padding: 1px;

        font-size: 10px;
    }

    .answers .small,
    .credits {
        display: none;
    }
}
</style>
</head>

<body>

<main>

<div class="top">

    <div class="title">
        <span class="clef">𝄞</span>
        <span id="appTitle">Gitaar Notentrainer</span>
    </div>

    <div class="lang">
        <button id="langNL" class="active">
            NL
        </button>

        <button id="langEN">
            EN
        </button>
    </div>

    <span class="stats">
        Score
        <b id="score">0</b>
    </span>

    <span class="stats">
        Pogingen
        <b id="tries">0</b>
    </span>

    <button id="natural" class="active">
        Hele noten
    </button>

    <button id="all">
        Ook halve
    </button>

    <button id="start">
        ▶ Start
    </button>

    <button id="errors">
        Fouten (0)
    </button>

    <button id="retry" disabled>
        ↻ Fouten oefenen
    </button>

    <button
        id="settingsToggle"
        class="settingsToggle"
        aria-expanded="false">
        ⚙
    </button>

</div>


<div
    id="settingsPanel"
    class="opts">

    <label>
        <span id="notesLabel">
            Noten op hals
        </span>

        <select id="show">

            <option value="none">
                Verbergen
            </option>

            <option value="all">
                Alle
            </option>

            <option value="natural">
                Hele
            </option>

            <option value="sharp">
                Halve
            </option>

        </select>
    </label>


    <label>
        <span id="roundLabel">
            Noten per ronde
        </span>

        <input
            id="round"
            type="number"
            min="5"
            max="50"
            step="5"
            value="5">
    </label>


    <button id="timerBtn">
        ⏱ Timer UIT
    </button>


    <select
        id="seconds"
        disabled>

        <option>3</option>

        <option selected>
            5
        </option>

        <option>10</option>

        <option>15</option>

    </select>

</div>


<div
    id="msg"
    class="status">

    Druk op Start om te beginnen.

</div>


<div
    id="timer"
    class="timer">

    <i id="timerBar"></i>

    <b id="timerText"></b>

</div>


<div class="progress">
    <i id="progress"></i>
</div>


<div
    id="neck"
    class="neck">
</div>


<div
    id="answers"
    class="answers">
</div>


<div class="credits">

    Prompt-fluisteraar:
    Bart Bervoets ·

    <a href="mailto:bart.bervoets3@gmail.com">
        ✉
    </a>

</div>

</main>


<script>
const q = selector =>
    document.querySelector(selector);


/* =========================================================
   LANGUAGE
   ========================================================= */

const langNL =
    q("#langNL");

const langEN =
    q("#langEN");

const appTitle =
    q("#appTitle");

const notesLabel =
    q("#notesLabel");

const roundLabel =
    q("#roundLabel");

const settingsToggle =
    q("#settingsToggle");

const settingsPanel =
    q("#settingsPanel");


let language =
    "nl";


const tr = {

    nl: {

        title:
            "Gitaar Notentrainer",

        natural:
            "Hele noten",

        all:
            "Ook halve",

        start:
            "Start",

        reset:
            "Reset",

        errors:
            "Fouten tonen",

        hideErrors:
            "Fouten verbergen",

        retry:
            "Fouten oefenen",

        notes:
            "Noten op hals",

        round:
            "Noten per ronde",

        hide:
            "Verbergen",

        allNotes:
            "Alle",

        naturalNotes:
            "Hele",

        sharps:
            "Halve",

        timerOn:
            "Timer AAN",

        timerOff:
            "Timer UIT",

        press:
            "Druk op Start om te beginnen.",

        practice:
            "OEFENKAART",

        correct:
            "Juist",

        correctNote:
            "Juiste noot",

        time:
            "Tijd om",

        complete:
            "Ronde voltooid"
    },


    en: {

        title:
            "Guitar Note Trainer",

        natural:
            "Natural notes",

        all:
            "Include sharps",

        start:
            "Start",

        reset:
            "Reset",

        errors:
            "Show mistakes",

        hideErrors:
            "Hide mistakes",

        retry:
            "Practice mistakes",

        notes:
            "Notes on neck",

        round:
            "Notes per round",

        hide:
            "Hide",

        allNotes:
            "All",

        naturalNotes:
            "Natural",

        sharps:
            "Sharps",

        timerOn:
            "Timer ON",

        timerOff:
            "Timer OFF",

        press:
            "Press Start to begin.",

        practice:
            "PRACTICE MAP",

        correct:
            "Correct",

        correctNote:
            "Correct note",

        time:
            "Time's up",

        complete:
            "Round complete"
    }

};


function T(key) {

    return tr[language][key];

}


/* =========================================================
   MUSIC DATA
   ========================================================= */

const notes = [

    "C",
    "C#",
    "D",
    "D#",
    "E",
    "F",
    "F#",
    "G",
    "G#",
    "A",
    "A#",
    "B"

];


const naturalSet =
    new Set([
        "A",
        "B",
        "C",
        "D",
        "E",
        "F",
        "G"
    ]);


/*
 * name
 * midi
 * string number
 * visual width
 */

const strings = [

    [
        "E",
        64,
        1,
        1
    ],

    [
        "B",
        59,
        2,
        1.4
    ],

    [
        "G",
        55,
        3,
        2
    ],

    [
        "D",
        50,
        4,
        2.9
    ],

    [
        "A",
        45,
        5,
        4
    ],

    [
        "E",
        40,
        6,
        5.1
    ]

];


/* =========================================================
   DOM
   ========================================================= */

const neck =
    q("#neck");

const answers =
    q("#answers");

const msg =
    q("#msg");

const scoreEl =
    q("#score");

const triesEl =
    q("#tries");

const start =
    q("#start");

const natural =
    q("#natural");

const all =
    q("#all");

const show =
    q("#show");

const round =
    q("#round");

const timerBtn =
    q("#timerBtn");

const seconds =
    q("#seconds");

const timer =
    q("#timer");

const timerBar =
    q("#timerBar");

const timerText =
    q("#timerText");

const progress =
    q("#progress");

const errorsBtn =
    q("#errors");

const retry =
    q("#retry");


/* =========================================================
   STATE
   ========================================================= */

let positions = [];

let score = 0;
let tries = 0;

let total = 5;

let playing = false;

let mode =
    "natural";

let active =
    null;

let locked =
    false;

let mistakes =
    [];

let errorsVisible =
    false;

let retryMode =
    false;

let retryPool =
    [];

let timerOn =
    false;

let deadline =
    0;

let tick =
    null;

let nextTimer =
    null;

let audio =
    null;


/* =========================================================
   HELPERS
   ========================================================= */

function nn(midi) {

    return notes[
        midi % 12
    ];

}


function freq(midi) {

    return (
        440 *
        Math.pow(
            2,
            (midi - 69) / 12
        )
    );

}


/* =========================================================
   REALISTIC FRET WIDTHS
   ========================================================= */

let widths = [];


for (
    let fret = 1;
    fret <= 12;
    fret++
) {

    const position =
        number =>
            650 *
            (
                1 -
                Math.pow(
                    2,
                    -number / 12
                )
            );


    widths.push(

        position(fret) -

        position(
            fret - 1
        )

    );

}


neck.style.setProperty(

    "--frets",

    widths
        .map(
            width =>
                `${width}fr`
        )
        .join(" ")

);


/* =========================================================
   BUILD NECK
   ========================================================= */

function build() {

    const nums =
        document.createElement(
            "div"
        );


    nums.className =
        "nums";


    nums.append(
        document.createElement(
            "div"
        )
    );


    for (
        let fret = 1;
        fret <= 12;
        fret++
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.textContent =
            fret;


        nums.append(
            element
        );

    }


    neck.append(
        nums
    );


    strings.forEach(
        (
            [
                name,
                base,
                stringNumber,
                stringWidth
            ]
        ) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "string";


            row.style.setProperty(

                "--sw",

                `${stringWidth}px`

            );


            /*
             * Nylon treble strings are light.
             * Bass strings use a warmer bronze colour.
             */

            row.style.setProperty(

                "--sc",

                stringNumber < 4

                    ?

                    "#f4ead9"

                    :

                    "#a98b67"

            );


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "label";


            label.textContent =
                name;


            row.append(
                label
            );


            const line =
                document.createElement(
                    "div"
                );


            line.className =
                "line";


            row.append(
                line
            );


            const cells = [];


            for (
                let fret = 1;
                fret <= 12;
                fret++
            ) {

                const cell =
                    document.createElement(
                        "div"
                    );


                cell.className =
                    "cell" +
                    (
                        fret === 1

                            ?

                            " first"

                            :

                            ""
                    );


                row.append(
                    cell
                );


                cells.push(
                    cell
                );


                positions.push({

                    element:
                        cell,

                    note:
                        nn(
                            base +
                            fret
                        ),

                    midi:
                        base +
                        fret,

                    fret,

                    open:
                        false,

                    stringNumber

                });

            }


            /*
             * Open string.
             */

            positions.push({

                element:
                    cells[0],

                note:
                    nn(base),

                midi:
                    base,

                fret:
                    0,

                open:
                    true,

                stringNumber

            });


            neck.append(
                row
            );

        }

    );

}


/* =========================================================
   ANSWER BUTTONS
   ========================================================= */

function buildAnswers() {

    const solfege = {

        A: "la",
        "A#": "la#",

        B: "si",

        C: "do",
        "C#": "do#",

        D: "re",
        "D#": "re#",

        E: "mi",

        F: "fa",
        "F#": "fa#",

        G: "sol",
        "G#": "sol#"

    };


    [

        "A",
        "A#",
        "B",

        "C",
        "C#",

        "D",
        "D#",

        "E",

        "F",
        "F#",

        "G",
        "G#"

    ].forEach(
        note => {

            const button =
                document.createElement(
                    "button"
                );


            button.dataset.note =
                note;


            button.className =

                note.includes("#")

                    ?

                    "sharp"

                    :

                    "";


            button.innerHTML =

                `${note}

                <span class="small">

                    ${solfege[note]}

                </span>`;


            button.onclick =
                () =>
                    answer(
                        note
                    );


            answers.append(
                button
            );

        }

    );

}


/* =========================================================
   AUDIO
   ========================================================= */

function ctx() {

    if (!audio) {

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if (
        audio.state ===
        "suspended"
    ) {

        audio.resume();

    }


    return audio;

}


function tone(
    midi,
    stringNumber
) {

    const context =
        ctx();


    const now =
        context.currentTime;


    const oscillator =
        context.createOscillator();


    const gain =
        context.createGain();


    const filter =
        context.createBiquadFilter();


    oscillator.type =
        "triangle";


    oscillator.frequency.value =
        freq(midi);


    filter.type =
        "lowpass";


    filter.frequency.value =

        1800 +

        (
            6 -
            stringNumber
        )
        *
        350;


    gain.gain.setValueAtTime(

        0.0001,

        now

    );


    gain.gain
        .exponentialRampToValueAtTime(

            0.22,

            now + 0.01

        );


    gain.gain
        .exponentialRampToValueAtTime(

            0.0001,

            now + 1.1

        );


    oscillator.connect(
        filter
    );


    filter.connect(
        gain
    );


    gain.connect(
        context.destination
    );


    oscillator.start();


    oscillator.stop(
        now + 1.15
    );

}


/* =========================================================
   CORRECT SOUND
   ========================================================= */

function good() {

    const context =
        ctx();


    const now =
        context.currentTime;


    [
        72,
        76,
        79
    ].forEach(
        (
            midi,
            index
        ) => {

            const oscillator =
                context.createOscillator();


            const gain =
                context.createGain();


            const time =

                now +

                index *
                0.065;


            oscillator.frequency.value =
                freq(midi);


            gain.gain.setValueAtTime(

                0.0001,

                time

            );


            gain.gain.exponentialRampToValueAtTime(

                0.07,

                time + 0.01

            );


            gain.gain.exponentialRampToValueAtTime(

                0.0001,

                time + 0.18

            );


            oscillator.connect(
                gain
            );


            gain.connect(
                context.destination
            );


            oscillator.start(
                time
            );


            oscillator.stop(
                time + 0.2
            );

        }

    );

}


/* =========================================================
   WRONG SOUND
   ========================================================= */

function bad() {

    const context =
        ctx();


    const now =
        context.currentTime;


    const oscillator =
        context.createOscillator();


    const gain =
        context.createGain();


    oscillator.frequency.setValueAtTime(

        185,

        now

    );


    oscillator.frequency.exponentialRampToValueAtTime(

        122,

        now + 0.4

    );


    gain.gain.setValueAtTime(

        0.0001,

        now

    );


    gain.gain.exponentialRampToValueAtTime(

        0.1,

        now + 0.02

    );


    gain.gain.exponentialRampToValueAtTime(

        0.0001,

        now + 0.42

    );


    oscillator.connect(
        gain
    );


    gain.connect(
        context.destination
    );


    oscillator.start(
        now
    );


    oscillator.stop(
        now + 0.44
    );

}


/* =========================================================
   ROUND SIZE
   ========================================================= */

function normRound() {

    let value =

        Math.round(

            (
                Number(
                    round.value
                )
                ||
                5
            )
            /
            5

        )
        *
        5;


    return Math.max(

        5,

        Math.min(

            50,

            value

        )

    );

}


/* =========================================================
   PROGRESS
   ========================================================= */

function updateProgress() {

    progress.style.width =

        (
            Math.min(
                tries,
                total
            )
            /
            total
            *
            100
        )
        +
        "%";

}


/* =========================================================
   QUESTION POOL
   ========================================================= */

function pool() {

    if (retryMode) {

        return retryPool;

    }


    if (
        mode ===
        "natural"
    ) {

        return positions.filter(

            position =>

                naturalSet.has(
                    position.note
                )

        );

    }


    return positions;

}


/* =========================================================
   DOT
   ========================================================= */

function clearDot() {

    document
        .querySelectorAll(
            ".dot"
        )
        .forEach(
            element =>
                element.remove()
        );

}


/* =========================================================
   TIMER
   ========================================================= */

function stopTimer() {

    clearInterval(
        tick
    );


    tick =
        null;


    timer.classList.remove(
        "on"
    );


    deadline =
        0;

}


function startTimer() {

    if (
        !timerOn ||
        show.value !== "none" ||
        !playing ||
        locked
    ) {

        return;

    }


    stopTimer();


    const duration =

        Number(
            seconds.value
        )
        *
        1000;


    deadline =

        performance.now() +

        duration;


    timer.classList.add(
        "on"
    );


    tick =
        setInterval(
            () => {

                const left =

                    Math.max(

                        0,

                        deadline -
                        performance.now()

                    );


                timerBar.style.width =

                    (
                        left /
                        duration *
                        100
                    )
                    +
                    "%";


                timerText.textContent =

                    (
                        left /
                        1000
                    )
                    .toFixed(1)
                    +
                    " s";


                if (
                    left <= 0
                ) {

                    stopTimer();

                    timeout();

                }

            },

            50

        );

}


/* =========================================================
   QUESTION
   ========================================================= */

function showQuestion() {

    if (
        !playing ||
        tries >= total
    ) {

        finish();

        return;

    }


    clearTimeout(
        nextTimer
    );


    stopTimer();

    clearDot();


    locked =
        false;


    const available =
        pool();


    if (!available.length) {

        return;

    }


    let next;


    do {

        next =
            available[
                Math.floor(
                    Math.random() *
                    available.length
                )
            ];

    }

    while (
        available.length > 1 &&
        active === next
    );


    active =
        next;


    const dot =
        document.createElement(
            "button"
        );


    dot.className =

        "dot" +

        (
            active.open

                ?

                " open"

                :

                ""
        );


    dot.onclick =
        () =>
            tone(

                active.midi,

                active.stringNumber

            );


    active.element.append(
        dot
    );


    /*
     * Hide black dot while using the neck as practice map.
     */

    if (
        show.value !==
        "none"
    ) {

        dot.style.display =
            "none";

    }

    else {

        tone(

            active.midi,

            active.stringNumber

        );

    }


    msg.textContent =

        show.value ===
        "none"

            ?

            ""

            :

            T(
                "practice"
            );


    startTimer();

}


/* =========================================================
   ERRORS
   ========================================================= */

function record() {

    mistakes.push(
        {
            ...active
        }
    );


    updateErrors();

}


function uniqueErrors() {

    const map =
        new Map();


    mistakes.forEach(
        mistake => {

            map.set(

                mistake.stringNumber +
                "-" +
                mistake.fret,

                mistake

            );

        }

    );


    return [
        ...map.values()
    ];

}


function updateErrors() {

    document
        .querySelectorAll(
            ".mistake"
        )
        .forEach(
            element =>
                element.remove()
        );


    const unique =
        uniqueErrors();


    errorsBtn.textContent =

        (
            errorsVisible

                ?

                T(
                    "hideErrors"
                )

                :

                T(
                    "errors"
                )
        )
        +
        ` (${unique.length})`;


    retry.disabled =
        !unique.length;


    retry.textContent =

        `↻ ${T(
            "retry"
        )} (${unique.length})`;


    if (
        errorsVisible
    ) {

        unique.forEach(
            error => {

                const marker =
                    document.createElement(
                        "span"
                    );


                marker.className =

                    "mistake" +

                    (
                        error.open

                            ?

                            " open"

                            :

                            ""
                    );


                error.element.append(
                    marker
                );

            }

        );

    }

}


/* =========================================================
   ANSWER
   ========================================================= */

function answer(note) {

    if (
        !playing ||
        locked ||
        show.value !== "none" ||
        !active
    ) {

        return;

    }


    if (
        mode === "natural" &&
        !retryMode &&
        note.includes("#")
    ) {

        return;

    }


    locked =
        true;


    stopTimer();


    tries++;


    triesEl.textContent =
        tries;


    const dot =

        active.element
            .querySelector(
                ".dot"
            );


    const correct =

        note ===
        active.note;


    if (correct) {

        score++;


        scoreEl.textContent =
            score;


        dot.classList.add(
            "good"
        );


        good();


        msg.textContent =

            `✓ ${T(
                "correct"
            )} · ${note}`;

    }

    else {

        dot.classList.add(
            "bad"
        );


        record();

        bad();


        msg.textContent =

            `✗ ${T(
                "correctNote"
            )}: ${active.note}`;

    }


    updateProgress();


    nextTimer =
        setTimeout(

            () =>

                tries >= total

                    ?

                    finish()

                    :

                    showQuestion(),

            correct

                ?

                650

                :

                950

        );

}


/* =========================================================
   TIMEOUT
   ========================================================= */

function timeout() {

    if (locked) {

        return;

    }


    locked =
        true;


    tries++;


    triesEl.textContent =
        tries;


    const dot =

        active.element
            .querySelector(
                ".dot"
            );


    if (dot) {

        dot.classList.add(
            "bad"
        );

    }


    record();

    bad();


    msg.textContent =

        `${T(
            "time"
        )} · ${T(
            "correctNote"
        )}: ${active.note}`;


    updateProgress();


    nextTimer =
        setTimeout(

            () =>

                tries >= total

                    ?

                    finish()

                    :

                    showQuestion(),

            1100

        );

}


/* =========================================================
   FINISH
   ========================================================= */

function finish() {

    playing =
        false;


    stopTimer();


    progress.style.width =
        "100%";


    start.textContent =

        `▶ ${T(
            "start"
        )}`;


    round.disabled =
        false;


    msg.textContent =

        `${T(
            "complete"
        )}: ${score} / ${total}`;

}


/* =========================================================
   PRACTICE MAP LABELS
   ========================================================= */

function labels() {

    document
        .querySelectorAll(
            ".note"
        )
        .forEach(
            element =>
                element.remove()
        );


    const selected =
        show.value;


    if (
        selected !==
        "none"
    ) {

        positions
            .filter(
                position =>
                    !position.open
            )
            .forEach(
                position => {

                    const sharp =

                        position.note
                            .includes("#");


                    const display =

                        selected ===
                        "all"

                        ||

                        (
                            selected ===
                            "natural"

                            &&

                            !sharp
                        )

                        ||

                        (
                            selected ===
                            "sharp"

                            &&

                            sharp
                        );


                    if (!display) {

                        return;

                    }


                    const element =

                        document.createElement(
                            "span"
                        );


                    element.className =

                        "note" +

                        (
                            sharp

                                ?

                                " sharp"

                                :

                                ""
                        );


                    element.textContent =
                        position.note;


                    position.element.append(
                        element
                    );

                }

            );

    }


    const dot =
        document.querySelector(
            ".dot"
        );


    if (dot) {

        dot.style.display =

            selected ===
            "none"

                ?

                ""

                :

                "none";

    }


    if (
        selected !==
        "none"
    ) {

        stopTimer();

    }

    else {

        startTimer();

    }


    updateErrors();

}


/* =========================================================
   SETTINGS
   ========================================================= */

settingsToggle.onclick =
    () => {

        const open =

            settingsPanel
                .classList
                .toggle(
                    "landscape-open"
                );


        settingsToggle
            .setAttribute(

                "aria-expanded",

                String(open)

            );

    };


function closeSettings() {

    settingsPanel
        .classList
        .remove(
            "landscape-open"
        );


    settingsToggle
        .setAttribute(

            "aria-expanded",

            "false"

        );

}


/* =========================================================
   RESET / START
   ========================================================= */

function resetGame() {

    closeSettings();


    clearTimeout(
        nextTimer
    );


    stopTimer();

    clearDot();


    score =
        0;


    tries =
        0;


    scoreEl.textContent =
        "0";


    triesEl.textContent =
        "0";


    /*
     * New round clears errors.
     */

    mistakes =
        [];


    errorsVisible =
        false;


    retryMode =
        false;


    retryPool =
        [];


    updateErrors();


    total =
        normRound();


    round.value =
        total;


    round.disabled =
        true;


    playing =
        true;


    locked =
        false;


    active =
        null;


    progress.style.width =
        "0%";


    start.textContent =

        `↻ ${T(
            "reset"
        )}`;


    showQuestion();

}


/* =========================================================
   EVENTS
   ========================================================= */

start.onclick =
    resetGame;


natural.onclick =
    () => {

        mode =
            "natural";


        natural
            .classList
            .add(
                "active"
            );


        all
            .classList
            .remove(
                "active"
            );


        document
            .querySelectorAll(
                ".answers .sharp"
            )
            .forEach(
                button =>
                    button.disabled =
                        true
            );


        if (playing) {

            showQuestion();

        }

    };


all.onclick =
    () => {

        mode =
            "all";


        all
            .classList
            .add(
                "active"
            );


        natural
            .classList
            .remove(
                "active"
            );


        document
            .querySelectorAll(
                ".answers .sharp"
            )
            .forEach(
                button =>
                    button.disabled =
                        false
            );


        if (playing) {

            showQuestion();

        }

    };


show.onchange =
    labels;


round.onchange =
    () => {

        round.value =
            normRound();


        total =
            Number(
                round.value
            );


        updateProgress();

    };


timerBtn.onclick =
    () => {

        timerOn =
            !timerOn;


        timerBtn
            .classList
            .toggle(
                "active",
                timerOn
            );


        timerBtn.textContent =

            "⏱ " +

            (
                timerOn

                    ?

                    T(
                        "timerOn"
                    )

                    :

                    T(
                        "timerOff"
                    )
            );


        seconds.disabled =
            !timerOn;


        if (timerOn) {

            startTimer();

        }

        else {

            stopTimer();

        }

    };


seconds.onchange =
    startTimer;


errorsBtn.onclick =
    () => {

        errorsVisible =
            !errorsVisible;


        updateErrors();

    };


retry.onclick =
    () => {

        closeSettings();


        const unique =
            uniqueErrors();


        if (!unique.length) {

            return;

        }


        retryMode =
            true;


        retryPool =
            unique;


        show.value =
            "none";


        labels();


        clearDot();


        score =
            0;


        tries =
            0;


        scoreEl.textContent =
            "0";


        triesEl.textContent =
            "0";


        total =
            unique.length;


        playing =
            true;


        locked =
            false;


        active =
            null;


        progress.style.width =
            "0%";


        start.textContent =

            `▶ ${T(
                "start"
            )}`;


        msg.textContent =

            T(
                "retry"
            );


        showQuestion();

    };


/* =========================================================
   LANGUAGE
   ========================================================= */

function applyLanguage() {

    document.documentElement.lang =
        language;


    langNL
        .classList
        .toggle(
            "active",
            language === "nl"
        );


    langEN
        .classList
        .toggle(
            "active",
            language === "en"
        );


    appTitle.textContent =
        T(
            "title"
        );


    natural.textContent =
        T(
            "natural"
        );


    all.textContent =
        T(
            "all"
        );


    notesLabel.textContent =
        T(
            "notes"
        );


    roundLabel.textContent =
        T(
            "round"
        );


    show.options[0].text =
        T(
            "hide"
        );


    show.options[1].text =
        T(
            "allNotes"
        );


    show.options[2].text =
        T(
            "naturalNotes"
        );


    show.options[3].text =
        T(
            "sharps"
        );


    timerBtn.textContent =

        "⏱ " +

        (
            timerOn

                ?

                T(
                    "timerOn"
                )

                :

                T(
                    "timerOff"
                )
        );


    start.textContent =

        playing

            ?

            `↻ ${T(
                "reset"
            )}`

            :

            `▶ ${T(
                "start"
            )}`;


    updateErrors();


    if (!playing) {

        msg.textContent =
            T(
                "press"
            );

    }

}


langNL.onclick =
    () => {

        language =
            "nl";


        applyLanguage();

    };


langEN.onclick =
    () => {

        language =
            "en";


        applyLanguage();

    };


/* =========================================================
   INITIALIZE
   ========================================================= */

build();

buildAnswers();

/*
 * Default:
 * natural notes only.
 */

natural.click();

updateErrors();

updateProgress();

applyLanguage();
</script>

</body>
</html>
