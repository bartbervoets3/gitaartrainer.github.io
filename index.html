<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gitaar Notentrainer</title>

<style>
:root {
    color-scheme: dark;

    --bg: #120d0a;
    --panel: #201713;
    --panel-light: #3b2921;

    --spruce: #d1a363;
    --spruce-light: #edcc94;
    --mahogany: #74432d;
    --mahogany-light: #975c3b;
    --rosewood: #38231e;
    --rosewood-dark: #261714;

    --cream: #f4ead5;
    --green: #4f9c65;
    --red: #b94c43;

    --label-width: 38px;
    --neck-width: 760px;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 18px;
    color: #f7eee3;
    background:
        radial-gradient(circle at top, #342319 0, var(--bg) 58%);
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
select,
input {
    font: inherit;
}

button {
    padding: 7px 10px;
    color: #f8ecda;
    background:
        linear-gradient(
            180deg,
            var(--mahogany-light),
            var(--mahogany)
        );
    border: 1px solid #a9704b;
    border-radius: 8px;
    box-shadow:
        inset 0 1px #ffffff1d,
        0 2px 3px #0005;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
    transition:
        background 0.15s,
        border-color 0.15s,
        transform 0.1s;
}

button:hover:not(:disabled) {
    background:
        linear-gradient(
            180deg,
            #ad7047,
            #855036
        );
}

button:active:not(:disabled) {
    transform: translateY(1px);
}

button:focus-visible,
select:focus-visible,
input:focus-visible,
a:focus-visible {
    outline: 3px solid #f1c77f;
    outline-offset: 2px;
}

button:disabled,
select:disabled,
input:disabled {
    cursor: not-allowed;
    opacity: 0.34;
}

#game {
    width: min(100%, 1080px);
    margin: auto;
    padding: 16px;
    overflow: hidden;
    background:
        linear-gradient(145deg, #241a15, var(--panel));
    border: 1px solid #be82532b;
    border-radius: 16px;
    box-shadow:
        0 18px 48px #0008,
        inset 0 1px #ffffff0a;
}

/* =========================================================
   HEADER
   ========================================================= */

.top {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
}

.title {
    display: flex;
    gap: 7px;
    align-items: center;
    margin-right: auto;
    font-size: 20px;
    font-weight: 800;
    white-space: nowrap;
}

.title-clef {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family:
        "DejaVu Serif",
        "Times New Roman",
        serif;
    font-size: 39px;
    font-weight: 400;
    line-height: 0.82;
    text-shadow: 0 2px 4px #000a;
    transform: translateY(1px);
    pointer-events: none;
    user-select: none;
}

.stat {
    padding: 6px 8px;
    background:
        linear-gradient(180deg, #473129, var(--panel-light));
    border: 1px solid #8e634c;
    border-radius: 8px;
    font-size: 12px;
    white-space: nowrap;
}

.mode {
    display: flex;
    gap: 3px;
    padding: 3px;
    background: var(--rosewood-dark);
    border: 1px solid #68453a;
    border-radius: 9px;
}

.mode button {
    min-height: 33px;
    padding: 6px 8px;
    color: #d8c7b0;
    background: transparent;
    border-color: transparent;
    box-shadow: none;
}

.mode button:hover:not(:disabled) {
    background: #624337;
}

.mode button.active {
    color: #2b1a10;
    background:
        linear-gradient(
            180deg,
            var(--spruce-light),
            var(--spruce)
        );
    border-color: #edca94;
}

.play {
    min-height: 35px;
    color: #2e1c10;
    background:
        linear-gradient(180deg, #e0bb7c, #bf8b50);
    border-color: #e6c48e;
}

.start {
    min-height: 35px;
    background:
        linear-gradient(180deg, #80523a, #593527);
}

.start.reset-mode {
    background:
        linear-gradient(180deg, #704536, #482a23);
}

.mistakes-button {
    min-height: 35px;
    background:
        linear-gradient(180deg, #644238, #432b25);
    border-color: #896052;
}

.mistakes-button.has-errors {
    color: #ffe8df;
    border-color: #bb7264;
}

.mistakes-button.active {
    background:
        linear-gradient(180deg, #8d463c, #5c2924);
    border-color: #d48c7f;
}

.practice-mistakes-button {
    min-height: 35px;
    color: #2a1a10;
    background:
        linear-gradient(180deg, #dfbd84, #b8834f);
    border-color: #e5c28a;
}

.practice-mistakes-button:hover:not(:disabled) {
    background:
        linear-gradient(180deg, #efd09a, #ca945b);
}

.practice-mistakes-button.active {
    color: #fff4e8;
    background:
        linear-gradient(180deg, #8d573a, #623824);
}

/* =========================================================
   OPTIONS
   ========================================================= */

.options-row {
    display: flex;
    gap: 7px;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    margin-top: 7px;
}

.control-group {
    display: flex;
    gap: 5px;
    align-items: center;
}

.control-label {
    color: #c9b69e;
    font-size: 11px;
    white-space: nowrap;
}

.compact-select,
.round-input {
    min-height: 35px;
    padding: 5px 7px;
    color: #f1dfc8;
    background: var(--rosewood);
    border: 1px solid #88604b;
    border-radius: 8px;
    font-size: 12px;
}

.round-input {
    width: 68px;
    font-weight: 700;
    text-align: center;
}

.timer-toggle {
    min-width: 108px;
    min-height: 35px;
    color: #ddd0c0;
    background:
        linear-gradient(180deg, #624239, #412a25);
    border-color: #81594b;
}

.timer-toggle.active {
    color: #29180f;
    background:
        linear-gradient(180deg, #deb374, #bd8247);
    border-color: #e2bb80;
}

/* =========================================================
   STATUS
   ========================================================= */

.message-row {
    display: flex;
    min-height: 38px;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
}

.msg {
    min-height: 24px;
    padding: 7px 0;
    font-size: 14px;
    font-weight: 700;
}

.msg.correct {
    color: #78cf90;
}

.msg.wrong {
    color: #ee9588;
}

.msg.practice {
    color: #dcc5a5;
    font-weight: 600;
}

.sound-status {
    color: #b9a994;
    font-size: 10px;
    text-align: right;
}

/* =========================================================
   TIMER
   ========================================================= */

.countdown-wrap {
    width: 100%;
    max-width: 760px;
    min-height: 27px;
    margin: 0 auto 5px;
}

.countdown {
    position: relative;
    display: none;
    width: 100%;
    height: 24px;
    overflow: hidden;
    background: #30231d;
    border: 1px solid #765646;
    border-radius: 7px;
    box-shadow: inset 0 1px 3px #0008;
}

.countdown.visible {
    display: block;
}

.timer-bar {
    position: absolute;
    inset: 0 auto 0 0;
    width: 100%;
    background:
        linear-gradient(90deg, #4b8f5e, #7eb985);
    transition:
        width 0.05s linear,
        background 0.2s;
}

.countdown.running-low .timer-bar {
    background:
        linear-gradient(90deg, #a93831, #d9674e);
}

.countdown.paused .timer-bar {
    background:
        linear-gradient(90deg, #76675a, #a69480);
}

.timer-time {
    position: absolute;
    z-index: 2;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    text-shadow: 0 1px 2px #000;
    font-variant-numeric: tabular-nums;
}

/* =========================================================
   PROGRESS
   ========================================================= */

.progress-section {
    width: 100%;
    max-width: 760px;
    margin: 0 auto 8px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    color: #aa9a86;
    font-size: 9px;
}

.progress-track {
    width: 100%;
    height: 7px;
    overflow: hidden;
    background: #33251e;
    border: 1px solid #ffffff0b;
    border-radius: 999px;
    box-shadow: inset 0 1px 2px #0008;
}

.progress-bar {
    width: 0;
    height: 100%;
    background:
        linear-gradient(90deg, #94603d, #d4a263);
    border-radius: 999px;
    transition: width 0.28s ease;
}

.progress-bar.complete {
    background:
        linear-gradient(90deg, #428756, #82c28f);
}

/* =========================================================
   PRACTICE CARD
   ========================================================= */

.practice-badge {
    display: none;
    width: fit-content;
    margin: 3px auto 6px;
    padding: 4px 10px;
    align-items: center;
    gap: 6px;
    color: #47321e;
    background:
        linear-gradient(180deg, #f0d7ad, #d6ad72);
    border: 1px solid #9b7447;
    border-radius: 999px;
    box-shadow: 0 2px 5px #0004;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.08em;
}

.practice-badge.visible {
    display: flex;
}

/* =========================================================
   GUITAR
   ========================================================= */

.scroll {
    width: 100%;
    padding: 2px 6px 6px;
    overflow-x: auto;
    overflow-y: hidden;
}

.neck {
    width: min(100%, var(--neck-width));
    min-width: 640px;
    margin: auto;
    padding: 4px 9px 5px;
    background:
        linear-gradient(
            90deg,
            #56361e 0%,
            #754b28 8%,
            #ae7947 40%,
            #916039 70%,
            #5b391f 100%
        );
    border: 1px solid #d6a66b45;
    border-radius: 7px;
    box-shadow:
        inset 0 0 19px #291608a8,
        inset 0 1px #e6ba8052,
        0 6px 15px #0006;
}

.neck.practice-mode {
    border: 2px solid #e3c28d;
    box-shadow:
        inset 0 0 22px #291608b8,
        inset 0 1px #f8ddb778,
        0 0 0 3px #e3c28d20,
        0 6px 15px #0006;
}

.nums,
.string {
    display: grid;
    grid-template-columns:
        var(--label-width)
        var(--fret-columns);
    align-items: center;
}

.nums {
    height: 18px;
    color: #261509;
    font-size: 9px;
    font-weight: 800;
    text-align: center;
}

.fret-number {
    display: flex;
    height: 100%;
    align-items: center;
    justify-content: center;
}

.string {
    position: relative;
    height: 30px;
}

.label {
    position: relative;
    z-index: 7;
    display: flex;
    height: 100%;
    align-items: center;
    justify-content: center;
    color: #28170b;
    font-size: 11px;
    font-weight: 900;
    text-shadow: 0 1px #e0ad70;
}

.cell {
    position: relative;
    display: flex;
    height: 30px;
    align-items: center;
    justify-content: center;
    border-right:
        var(--fret-width, 2px)
        solid
        var(--fret-color, #d8d4cc);
    box-shadow:
        inset -1px 0 #56514c,
        inset 1px 0 #ffffff12;
}

.cell.first {
    border-left: 7px solid #f1e8d4;
    box-shadow:
        inset 2px 0 #6f6250,
        inset -1px 0 #423a30;
}

/* Strings */

.string-line {
    position: absolute;
    z-index: 2;
    top: 50%;
    right: 0;
    left: var(--label-width);
    height: var(--string-width);
    transform: translateY(-50%);
    background: var(--string-color);
    border-radius: 999px;
    box-shadow:
        0 1px 1px #2b1a0d,
        0 -1px #ffffff48;
    pointer-events: none;
}

.string.wound .string-line {
    background:
        repeating-linear-gradient(
            90deg,
            var(--string-color) 0,
            var(--string-color) 3px,
            var(--string-highlight) 3px,
            var(--string-highlight) 4px
        );
}

/* Fret markers */

.fret-position-marker {
    position: absolute;
    z-index: 3;
    top: 100%;
    left: 50%;
    width: 8px;
    height: 8px;
    transform: translate(-50%, -50%);
    background: #ead7b7;
    border: 1px solid #6f5133;
    border-radius: 50%;
    opacity: 0.74;
    pointer-events: none;
}

/* Practice-card labels */

.fret-note-label {
    position: absolute;
    z-index: 4;
    top: 50%;
    left: 50%;
    min-width: 19px;
    padding: 3px 4px;
    transform: translate(-50%, -50%);
    color: #302014;
    background: #f1dfc2e8;
    border: 1px solid #725335;
    border-radius: 4px;
    box-shadow:
        0 1px 2px #0005,
        inset 0 1px #fff5;
    font-size: 8px;
    font-weight: 900;
    line-height: 1;
    text-align: center;
    pointer-events: none;
    user-select: none;
}

.fret-note-label.sharp {
    color: #fff;
    background: #342116ef;
    border-color: #a8845d;
}

.neck.practice-mode .fret-note-label {
    color: #24170d;
    background: #f6e7cb;
    border-color: #8b673f;
}

.neck.practice-mode .fret-note-label.sharp {
    color: #fff;
    background: #352116;
    border-color: #c29968;
}

/* Active quiz marker */

.dot {
    position: relative;
    z-index: 12;
    width: 22px;
    height: 22px;
    padding: 0;
    background: #101010;
    border: 3px solid #050505;
    border-radius: 50%;
    box-shadow:
        0 2px 5px #000a,
        inset 0 1px #ffffff1c;
}

.dot.practice-hidden {
    display: none;
}

.dot.open {
    position: absolute;
    top: 50%;
    left: 0;
    width: 25px;
    height: 25px;
    transform: translate(-50%, -50%);
    border: 3px solid var(--cream);
    box-shadow:
        0 0 0 3px #5f4227,
        0 2px 6px #000a;
}

.dot.good {
    background: var(--green);
}

.dot.bad {
    background: var(--red);
}

/* =========================================================
   MISTAKE DOTS
   ========================================================= */

.mistake-dot {
    position: absolute;
    z-index: 9;
    top: 50%;
    left: 50%;
    width: 13px;
    height: 13px;
    transform: translate(-50%, -50%);
    background: #bd493f;
    border: 2px solid #f0b6ac;
    border-radius: 50%;
    box-shadow:
        0 1px 3px #0008,
        0 0 0 1px #722a24;
    pointer-events: none;
}

.mistake-dot.open {
    left: 0;
    width: 14px;
    height: 14px;
}

.mistake-dot.multiple::after {
    content: attr(data-count);
    position: absolute;
    top: -7px;
    right: -7px;
    display: flex;
    min-width: 13px;
    height: 13px;
    padding: 0 2px;
    align-items: center;
    justify-content: center;
    color: #fff;
    background: #67241f;
    border: 1px solid #efada3;
    border-radius: 999px;
    font-size: 7px;
    font-weight: 900;
}

/* =========================================================
   ANSWER BUTTONS
   ========================================================= */

.answer-keys {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 12px;
}

.key {
    display: flex;
    min-width: 53px;
    min-height: 52px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 7px 10px;
    color: #2a1a10;
    background:
        linear-gradient(180deg, #f0d39e, #cf9c5d);
    border-color: #e5bf83;
}

.key:hover:not(:disabled) {
    background:
        linear-gradient(180deg, #f6dfb3, #d9aa6d);
}

.key.sharp {
    color: #fff;
    background:
        linear-gradient(180deg, #624137, #35231e);
    border-color: #8e6656;
}

.key.sharp:hover:not(:disabled) {
    background:
        linear-gradient(180deg, #765043, #432c25);
}

.note-main {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.05;
    pointer-events: none;
    user-select: none;
}

.note-solfege {
    margin-top: 4px;
    font-size: 9px;
    font-style: italic;
    font-weight: 400;
    line-height: 1;
    opacity: 0.58;
    pointer-events: none;
    user-select: none;
}

.key.sharp .note-solfege {
    color: #e2d2c2;
}

.hint {
    margin-top: 9px;
    color: #bba991;
    font-size: 11px;
    line-height: 1.45;
    text-align: center;
}

/* =========================================================
   CREDIT
   ========================================================= */

.credits {
    display: flex;
    gap: 7px;
    align-items: center;
    justify-content: center;
    margin-top: 14px;
    color: #c0ad96;
    font-size: 10px;
    font-style: italic;
    opacity: 0.92;
}

.credit-mail {
    display: inline-flex;
    width: 24px;
    height: 24px;
    align-items: center;
    justify-content: center;
    color: #e0caae;
    font-size: 14px;
    font-style: normal;
    text-decoration: none;
    background: var(--rosewood);
    border: 1px solid #87634e;
    border-radius: 50%;
}

.credit-mail:hover {
    color: #27170d;
    background: var(--spruce-light);
    border-color: var(--spruce-light);
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {
    :root {
        --label-width: 22px;
    }

    body {
        padding: 0;
        background: var(--panel);
    }

    #game {
        width: 100%;
        min-height: 100svh;
        padding: 7px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
    }

    .top {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 5px;
    }

    .title {
        grid-column: 1 / -1;
        justify-content: center;
        margin: 0;
        font-size: 18px;
    }

    .title-clef {
        font-size: 33px;
    }

    .stat {
        padding: 5px;
        font-size: 12px;
        text-align: center;
    }

    .mode {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
    }

    .mode button {
        min-height: 35px;
    }

    .play,
    .start,
    .mistakes-button,
    .practice-mistakes-button {
        width: 100%;
        min-height: 37px;
        padding: 5px 3px;
    }

    .options-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        margin-top: 5px;
    }

    .notes-control {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns:
            auto
            minmax(0, 1fr);
    }

    .round-control {
        display: grid;
        grid-template-columns:
            minmax(0, 1fr)
            70px;
    }

    .timer-control {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns:
            minmax(0, 1fr)
            86px;
    }

    .timer-toggle,
    .compact-select,
    .round-input {
        min-height: 37px;
    }

    .timer-toggle,
    .round-input {
        width: 100%;
        min-width: 0;
    }

    .message-row {
        display: block;
        min-height: 38px;
    }

    .msg {
        min-height: 22px;
        padding: 5px 2px 1px;
        font-size: 13px;
        text-align: center;
    }

    .sound-status {
        margin-bottom: 2px;
        font-size: 8px;
        text-align: center;
    }

    .practice-badge {
        margin: 2px auto 4px;
        padding: 3px 8px;
        font-size: 8px;
    }

    .countdown-wrap {
        min-height: 25px;
        margin-bottom: 4px;
    }

    .progress-section {
        margin-bottom: 5px;
    }

    .scroll {
        padding: 0 0 3px;
        overflow: visible;
    }

    .neck {
        width: 96%;
        min-width: 0;
        margin: 0 auto;
        padding: 3px 2px 4px;
        border-radius: 5px;
    }

    .neck.practice-mode {
        width: 98%;
    }

    .nums {
        height: 13px;
        font-size: 6px;
    }

    .string,
    .cell {
        height: 23px;
    }

    .label {
        font-size: 8px;
    }

    .cell {
        border-right-width: 1px;
    }

    .cell.first {
        border-left-width: 4px;
    }

    .fret-position-marker {
        width: 6px;
        height: 6px;
    }

    .fret-note-label {
        min-width: 13px;
        padding: 1px 2px;
        font-size: 6px;
    }

    .neck.practice-mode .fret-note-label {
        min-width: 14px;
        padding: 2px;
        font-size: 6.5px;
    }

    .dot {
        width: 18px;
        height: 18px;
        border-width: 2px;
    }

    .dot.open {
        width: 21px;
        height: 21px;
        border-width: 2px;
        box-shadow:
            0 0 0 2px #5f4227,
            0 2px 4px #0009;
    }

    .mistake-dot {
        width: 10px;
        height: 10px;
        border-width: 1px;
    }

    .mistake-dot.open {
        width: 11px;
        height: 11px;
    }

    .answer-keys {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 5px;
        width: 100%;
        margin-top: 8px;

<script>

    /* =====================================================

    const fretCount = 12;

    const strings = [

    const noteNames = [

    const answerNotes = [

    /* =====================================================
       FRET GEOMETRY
       ===================================================== */

    function distanceFromNut(fret) {
        return (
            scaleLengthMm *
            (
                1 -
                Math.pow(
                    2,
                    -fret / 12
                )
            )
        );
    }

    const fretWidthsMm =
        Array.from(
            { length: fretCount },
            (_, index) => {
                const fret = index + 1;

                return (
                    distanceFromNut(fret) -
                    distanceFromNut(fret - 1)
                );
            }
        );

    neck.style.setProperty(
        "--fret-columns",
        fretWidthsMm
            .map(width => `${width}fr`)
            .join(" ")
    );

    /* =====================================================
       STATE
       ===================================================== */

    const positions = [];

    let totalQuestions = 5;
    let activeRoundTotal = 5;

    let score = 0;
    let tries = 0;

    let mistakes = [];
    let mistakesVisible = false;

    let mistakesPracticeMode = false;
    let mistakesPracticePool = [];

    let activePosition = null;

    let playing = false;
    let started = false;
    let roundFinished = false;
    let answerLocked = false;

    let mode = "natural";
    let notesDisplayMode = "hidden";

    let questionTimer = null;

    let timerEnabled = false;
    let countdownInterval = null;
    let timerDeadline = null;
    let remainingTimeMs = null;

    let audioContext = null;
    let currentSource = null;

    /* =====================================================
       HELPERS
       ===================================================== */

    function isPracticeCardVisible() {
        return notesDisplayMode !== "hidden";
    }

    function noteNameFromMidi(midi) {
        return noteNames[midi % 12];
    }

    function midiToFrequency(midi) {
        return (
            440 *
            Math.pow(
                2,
                (midi - 69) / 12
            )
        );
    }

    function setMessage(
        text,
        state = ""
    ) {
        message.textContent = text;

        message.classList.remove(
            "correct",
            "wrong",
            "practice"
        );

        if (state) {
            message.classList.add(state);
        }
    }

    function normalizeRoundSize(value) {
        let amount = Number(value);

        if (!Number.isFinite(amount)) {
            amount = 5;
        }

        amount =
            Math.round(amount / 5) * 5;

        return Math.max(
            5,
            Math.min(
                50,
                amount
            )
        );
    }

    function updateRoundSize() {
        totalQuestions =
            normalizeRoundSize(
                roundSize.value
            );

        roundSize.value =
            String(totalQuestions);

        if (
            !started ||
            roundFinished
        ) {
            activeRoundTotal =
                totalQuestions;

            updateProgress();
        }

        updateModeInterface();
    }

    function updateStartButton() {
        if (
            started &&
            !roundFinished &&
            !mistakesPracticeMode
        ) {
            startButton.textContent =
                "↻ Reset";

            startButton.classList.add(
                "reset-mode"
            );
        } else {
            startButton.textContent =
                "▶ Start";

            startButton.classList.remove(
                "reset-mode"
            );
        }
    }

    /* =====================================================
       AUDIO
       ===================================================== */

    function getAudioContext() {
        if (!audioContext) {
            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContextClass) {
                soundStatus.textContent =
                    "Web Audio API wordt niet ondersteund.";

                return null;
            }

            audioContext =
                new AudioContextClass();
        }

        return audioContext;
    }

    async function unlockAudio() {
        const context =
            getAudioContext();

        if (!context) {
            return false;
        }

        if (context.state === "suspended") {
            try {
                await context.resume();
            } catch {
                soundStatus.textContent =
                    "Geluid kon niet worden gestart.";

                return false;
            }
        }

        if (context.state === "running") {
            soundStatus.textContent =
                "🔊 Tik op het bolletje om opnieuw te horen";

            return true;
        }

        return false;
    }

    async function playKarplusStrong(
        midi,
        stringNumber
    ) {
        const unlocked =
            await unlockAudio();

        if (!unlocked) {
            return;
        }

        const context = audioContext;
        const now = context.currentTime;
        const sampleRate = context.sampleRate;
        const frequency =
            midiToFrequency(midi);

        const delayLength =
            Math.max(
                2,
                Math.round(
                    sampleRate /
                    frequency -
                    0.5
                )
            );

        const bassFactor =
            (stringNumber - 1) / 5;

        const duration =
            2.1 +
            bassFactor * 0.9;

        const feedback =
            0.9925 +
            bassFactor * 0.002;

        const brightness =
            0.48 +
            (1 - bassFactor) * 0.12;

        const totalSamples =
            Math.ceil(
                duration *
                sampleRate
            );

        const delay =
            new Float32Array(delayLength);

        const output =
            new Float32Array(totalSamples);

        let previousNoise = 0;

        for (
            let index = 0;
            index < delayLength;
            index++
        ) {
            const noise =
                Math.random() * 2 - 1;

            const softNoise =
                noise * brightness +
                previousNoise *
                (1 - brightness);

            const envelope =
                0.72 +
                0.28 *
                Math.sin(
                    Math.PI *
                    index /
                    delayLength
                );

            delay[index] =
                softNoise *
                envelope *
                0.78;

            previousNoise = noise;
        }

        let delayIndex = 0;
        let previousSample = 0;

        for (
            let index = 0;
            index < totalSamples;
            index++
        ) {
            const current =
                delay[delayIndex];

            const next =
                delay[
                    (delayIndex + 1) %
                    delayLength
                ];

            const averaged =
                0.47 * current +
                0.47 * next +
                0.06 * previousSample;

            const attack =
                Math.min(
                    1,
                    index /
                    Math.max(
                        1,
                        sampleRate * 0.004
                    )
                );

            const remaining =
                totalSamples - index;

            const release =
                Math.min(
                    1,
                    remaining /
                    Math.max(
                        1,
                        sampleRate * 0.08
                    )
                );

            output[index] =
                current *
                attack *
                release;

            delay[delayIndex] =
                averaged * feedback;

            previousSample = current;

            delayIndex =
                (delayIndex + 1) %
                delayLength;
        }

        const buffer =
            context.createBuffer(
                1,
                totalSamples,
                sampleRate
            );

        buffer.copyToChannel(output, 0);

        if (currentSource) {
            try {
                currentSource.stop();
            } catch {}
        }

        const source =
            context.createBufferSource();

        source.buffer = buffer;

        const body =
            context.createBiquadFilter();

        body.type = "peaking";
        body.frequency.value = 205;
        body.Q.value = 1.15;
        body.gain.value = 4.1;

        const warmth =
            context.createBiquadFilter();

        warmth.type = "lowpass";

        warmth.frequency.value =
            2800 +
            (1 - bassFactor) * 1300;

        warmth.Q.value = 0.72;

        const master =
            context.createGain();

        master.gain.setValueAtTime(
            0.0001,
            now
        );

        master.gain.exponentialRampToValueAtTime(
            0.48,
            now + 0.008
        );

        master.gain.exponentialRampToValueAtTime(
            0.0001,
            now + duration
        );

        source.connect(body);
        body.connect(warmth);
        warmth.connect(master);
        master.connect(context.destination);

        source.addEventListener(
            "ended",
            () => {
                if (currentSource === source) {
                    currentSource = null;
                }
            }
        );

        currentSource = source;
        source.start(now);
    }

    function playCorrectSound() {
        const context = getAudioContext();

        if (
            !context ||
            context.state !== "running"
        ) {
            return;
        }

        const now = context.currentTime;

        [
            { midi: 72, delay: 0 },
            { midi: 76, delay: 0.065 },
            { midi: 79, delay: 0.13 }
        ].forEach(item => {
            const oscillator =
                context.createOscillator();

            const gain =
                context.createGain();

            const start =
                now + item.delay;

            oscillator.type = "sine";

            oscillator.frequency.setValueAtTime(
                midiToFrequency(item.midi),
                start
            );

            gain.gain.setValueAtTime(
                0.0001,
                start
            );

            gain.gain.exponentialRampToValueAtTime(
                0.07,
                start + 0.008
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                start + 0.18
            );

            oscillator.connect(gain);
            gain.connect(context.destination);

            oscillator.start(start);
            oscillator.stop(start + 0.2);
        });
    }

    function playWrongSound() {
        const context = getAudioContext();

        if (
            !context ||
            context.state !== "running"
        ) {
            return;
        }

        const now = context.currentTime;

        const oscillator =
            context.createOscillator();

        const formant =
            context.createBiquadFilter();

        const gain =
            context.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
            185,
            now
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            122,
            now + 0.42
        );

        formant.type = "bandpass";
        formant.frequency.value = 480;
        formant.Q.value = 1.2;

        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.11,
            now + 0.025
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.44
        );

        oscillator.connect(formant);
        formant.connect(gain);
        gain.connect(context.destination);

        oscillator.start(now);
        oscillator.stop(now + 0.46);
    }

    /* =====================================================
       MISTAKES
       ===================================================== */

    function recordMistake(
        selectedNote,
        timeout = false
    ) {
        if (!activePosition) {
            return;
        }

        mistakes.push({
            element:
                activePosition.element,
            midi:
                activePosition.midi,
            fret:
                activePosition.fret,
            stringNumber:
                activePosition.stringNumber,
            note:
                activePosition.note,
            selected:
                timeout
                    ? "Tijd"
                    : selectedNote
        });

        updateMistakes();
    }

    function getUniqueMistakePositions() {
        const unique =
            new Map();

        mistakes.forEach(mistake => {
            const key =
                `${mistake.stringNumber}-${mistake.fret}`;

            if (!unique.has(key)) {
                unique.set(key, mistake);
            }
        });

        return Array.from(
            unique.values()
        );
    }

    function buildMistakesPracticePool() {
        return getUniqueMistakePositions()
            .map(mistake => ({
                element:
                    mistake.element,
                midi:
                    mistake.midi,
                fret:
                    mistake.fret,
                open:
                    mistake.fret === 0,
                stringNumber:
                    mistake.stringNumber,
                note:
                    mistake.note
            }));
    }

    function updateMistakePracticeButton() {
        const uniqueCount =
            getUniqueMistakePositions().length;

        practiceMistakesButton.disabled =
            uniqueCount === 0 &&
            !mistakesPracticeMode;

        practiceMistakesButton.classList.toggle(
            "active",
            mistakesPracticeMode
        );

        practiceMistakesButton.textContent =
            mistakesPracticeMode
                ? "■ Stop fouten oefenen"
                : `↻ Fouten oefenen (${uniqueCount})`;
    }

    function updateMistakes() {
        game
            .querySelectorAll(
                ".mistake-dot"
            )
            .forEach(marker => {
                marker.remove();
            });

        const groupedPositions =
            new Map();

        mistakes.forEach(mistake => {
            const key =
                `${mistake.stringNumber}-${mistake.fret}`;

            if (!groupedPositions.has(key)) {
                groupedPositions.set(
                    key,
                    {
                        ...mistake,
                        count: 1
                    }
                );
            } else {
                groupedPositions.get(key).count += 1;
            }
        });

        const uniqueCount =
            groupedPositions.size;

        mistakesButton.textContent =
            mistakesVisible
                ? `Fouten verbergen (${uniqueCount})`
                : `Fouten tonen (${uniqueCount})`;

        mistakesButton.classList.toggle(
            "has-errors",
            uniqueCount > 0
        );

        mistakesButton.classList.toggle(
            "active",
            mistakesVisible
        );

        mistakesButton.setAttribute(
            "aria-pressed",
            String(mistakesVisible)
        );

        updateMistakePracticeButton();

        if (
            !mistakesVisible ||
            uniqueCount === 0
        ) {
            return;
        }

        groupedPositions.forEach(mistake => {
            const marker =
                document.createElement("span");

            marker.className =
                "mistake-dot";

            if (mistake.fret === 0) {
                marker.classList.add("open");
            }

            if (mistake.count > 1) {
                marker.classList.add("multiple");

                marker.dataset.count =
                    String(mistake.count);
            }

            marker.title =
                mistake.fret === 0
                    ? `Snaar ${mistake.stringNumber}, open ${mistake.note}`
                    : `Snaar ${mistake.stringNumber}, fret ${mistake.fret}, ${mistake.note}`;

            mistake.element.appendChild(marker);
        });
    }

    function resetMistakes() {
        mistakes = [];
        mistakesVisible = false;

        mistakesPracticeMode = false;
        mistakesPracticePool = [];

        updateMistakes();
    }

    /* =====================================================
       PROGRESS AND ROUND
       ===================================================== */

    function updateProgress() {
        const safeTotal =
            Math.max(
                1,
                activeRoundTotal
            );

        const completed =
            Math.min(
                tries,
                safeTotal
            );

        progressBar.style.width =
            `${completed / safeTotal * 100}%`;

        progressText.textContent =
            `${completed} / ${safeTotal}`;

        progressLabel.textContent =
            mistakesPracticeMode
                ? "Fouten oefenen"
                : "Ronde";

        progressBar.classList.toggle(
            "complete",
            completed >= safeTotal
        );
    }

    function clearQuestionTimer() {
        if (questionTimer !== null) {
            window.clearTimeout(questionTimer);
            questionTimer = null;
        }
    }

    function finishRound() {
        stopCountdown(true);
        clearQuestionTimer();

        playing = false;
        roundFinished = true;
        answerLocked = true;

        playPauseButton.textContent =
            "▶ PLAY";

        playPauseButton.disabled = true;

        roundSize.disabled = false;

        progressBar.style.width =
            "100%";

        progressBar.classList.add(
            "complete"
        );

        updateStartButton();
        updateModeInterface();

        if (mistakesPracticeMode) {
            setMessage(
                `Foutenoefening voltooid: ${score} / ${activeRoundTotal} juist.`,
                score === activeRoundTotal
                    ? "correct"
                    : ""
            );
        } else {
            setMessage(
                `Ronde voltooid: ${score} / ${activeRoundTotal} juist. Druk op Start voor een nieuwe ronde.`,
                score / activeRoundTotal >= 0.75
                    ? "correct"
                    : ""
            );
        }
    }

    function continueOrFinish(delay) {
        updateProgress();

        questionTimer =
            window.setTimeout(
                tries >= activeRoundTotal
                    ? finishRound
                    : showNextQuestion,
                delay
            );
    }

    /* =====================================================
       TIMER
       ===================================================== */

    function getSelectedTimerMs() {
        const seconds =
            Number(timerSeconds.value);

        return Number.isFinite(seconds)
            ? Math.max(
                1000,
                Math.min(
                    60000,
                    seconds * 1000
                )
            )
            : 5000;
    }

    function updateCountdownDisplay(
        milliseconds,
        paused = false
    ) {
        if (!timerEnabled) {
            countdown.classList.remove(
                "visible",
                "running-low",
                "paused"
            );

            timerBar.style.width = "100%";
            timerTime.textContent = "";
            return;
        }

        const remaining =
            Math.max(
                0,
                Number.isFinite(milliseconds)
                    ? milliseconds
                    : 0
            );

        timerBar.style.width =
            `${Math.min(
                100,
                remaining /
                getSelectedTimerMs() *
                100
            )}%`;

        timerTime.textContent =
            paused
                ? `⏸ ${(remaining / 1000).toFixed(1)} s`
                : `${(remaining / 1000).toFixed(1)} s`;

        countdown.classList.add("visible");

        countdown.classList.toggle(
            "running-low",
            !paused &&
            remaining <= 2000
        );

        countdown.classList.toggle(
            "paused",
            paused
        );
    }

    function clearCountdownInterval() {
        if (countdownInterval !== null) {
            window.clearInterval(
                countdownInterval
            );

            countdownInterval = null;
        }
    }

    function stopCountdown(
        clearRemaining = true
    ) {
        clearCountdownInterval();
        timerDeadline = null;

        if (clearRemaining) {
            remainingTimeMs = null;
        }

        if (!timerEnabled) {
            updateCountdownDisplay(0);
        }
    }

    function pauseCountdown() {
        if (
            !timerEnabled ||
            timerDeadline === null
        ) {
            return;
        }

        remainingTimeMs =
            Math.max(
                0,
                timerDeadline -
                performance.now()
            );

        clearCountdownInterval();
        timerDeadline = null;

        updateCountdownDisplay(
            remainingTimeMs,
            true
        );
    }

    function startCountdown(
        useRemaining = false
    ) {
        clearCountdownInterval();

        if (
            !timerEnabled ||
            !started ||
            !playing ||
            roundFinished ||
            !activePosition ||
            answerLocked ||
            isPracticeCardVisible()
        ) {
            return;
        }

        remainingTimeMs =
            useRemaining &&
            remainingTimeMs !== null
                ? remainingTimeMs
                : getSelectedTimerMs();

        timerDeadline =
            performance.now() +
            remainingTimeMs;

        const update = () => {
            if (
                timerDeadline === null ||
                answerLocked ||
                !playing
            ) {
                return;
            }

            remainingTimeMs =
                Math.max(
                    0,
                    timerDeadline -
                    performance.now()
                );

            updateCountdownDisplay(
                remainingTimeMs
            );

            if (remainingTimeMs <= 0) {
                handleTimeout();
            }
        };

        update();

        countdownInterval =
            window.setInterval(
                update,
                50
            );
    }

    function handleTimeout() {
        if (
            answerLocked ||
            !activePosition ||
            roundFinished ||
            isPracticeCardVisible()
        ) {
            return;
        }

        answerLocked = true;

        stopCountdown(true);

        timerBar.style.width = "0%";
        timerTime.textContent = "Tijd om!";

        countdown.classList.add(
            "visible",
            "running-low"
        );

        tries += 1;

        triesDisplay.textContent =
            String(tries);

        const dot =
            activePosition
                .element
                .querySelector(".dot");

        if (dot) {
            dot.classList.add("bad");
        }

        recordMistake(null, true);
        playWrongSound();

        setMessage(
            `Tijd om · juiste noot: ${activePosition.note}`,
            "wrong"
        );

        continueOrFinish(1250);
    }

    function updateTimerInterface() {
        timerToggle.classList.toggle(
            "active",
            timerEnabled
        );

        timerToggle.setAttribute(
            "aria-pressed",
            String(timerEnabled)
        );

        timerToggle.textContent =
            timerEnabled
                ? "⏱ Timer: AAN"
                : "⏱ Timer: UIT";

        timerSeconds.disabled =
            !timerEnabled;

        if (!timerEnabled) {
            stopCountdown(true);
            updateCountdownDisplay(0);
        } else if (
            started &&
            playing &&
            activePosition &&
            !answerLocked &&
            !roundFinished &&
            !isPracticeCardVisible()
        ) {
            startCountdown(false);
        } else {
            updateCountdownDisplay(
                getSelectedTimerMs(),
                started &&
                !playing &&
                !roundFinished
            );
        }
    }

    /* =====================================================
       BUILD FRETBOARD
       ===================================================== */

    function buildFretboard() {
        const numbers =
            document.createElement("div");

        numbers.className = "nums";

        numbers.appendChild(
            document.createElement("div")
        );

        for (
            let fret = 1;
            fret <= fretCount;
            fret++
        ) {
            const number =
                document.createElement("div");

            number.className =
                "fret-number";

            number.textContent =
                String(fret);

            numbers.appendChild(number);
        }

        neck.appendChild(numbers);

        strings.forEach(string => {
            const row =
                document.createElement("div");

            row.className = "string";

            if (string.wound) {
                row.classList.add("wound");
            }

            row.style.setProperty(
                "--string-width",
                `${string.width}px`
            );

            row.style.setProperty(
                "--string-color",
                string.color
            );

            row.style.setProperty(
                "--string-highlight",
                string.highlight
            );

            const label =
                document.createElement("div");

            label.className = "label";
            label.textContent = string.name;

            row.appendChild(label);

            const line =
                document.createElement("div");

            line.className = "string-line";
            row.appendChild(line);

            const cells = [];

            for (
                let fret = 1;
                fret <= fretCount;
                fret++
            ) {
                const cell =
                    document.createElement("div");

                cell.className = "cell";

                if (fret === 1) {
                    cell.classList.add("first");
                }

                if (fret === 12) {
                    cell.style.setProperty(
                        "--fret-width",
                        "3px"
                    );
                }

                if (
                    string.number === 3 &&
                    (
                        fret === 5 ||
                        fret === 7
                    )
                ) {
                    const marker =
                        document.createElement("span");

                    marker.className =
                        "fret-position-marker";

                    cell.appendChild(marker);
                }

                row.appendChild(cell);
                cells.push(cell);

                const midi =
                    string.midi + fret;

                positions.push({
                    element: cell,
                    note:
                        noteNameFromMidi(midi),
                    midi,
                    fret,
                    open: false,
                    stringNumber:
                        string.number
                });
            }

            positions.push({
                element: cells[0],
                note:
                    noteNameFromMidi(
                        string.midi
                    ),
                midi: string.midi,
                fret: 0,
                open: true,
                stringNumber:
                    string.number
            });

            neck.appendChild(row);
        });
    }

    /* =====================================================
       PRACTICE CARD
       ===================================================== */

    function shouldShowFretNote(note) {
        const sharp =
            note.includes("#");

        return (
            notesDisplayMode === "all" ||
            (
                notesDisplayMode === "natural" &&
                !sharp
            ) ||
            (
                notesDisplayMode === "sharp" &&
                sharp
            )
        );
    }

    function updatePracticeCardMode() {
        const practiceVisible =
            isPracticeCardVisible();

        neck.classList.toggle(
            "practice-mode",
            practiceVisible
        );

        practiceBadge.classList.toggle(
            "visible",
            practiceVisible
        );

        game
            .querySelectorAll(".dot")
            .forEach(dot => {
                dot.classList.toggle(
                    "practice-hidden",
                    practiceVisible
                );
            });

        if (practiceVisible) {
            if (
                timerEnabled &&
                timerDeadline !== null
            ) {
                pauseCountdown();
            }

            setMessage(
                "Bekijk de noten op de hals",
                "practice"
            );
        } else if (
            started &&
            playing &&
            !roundFinished &&
            activePosition &&
            !answerLocked
        ) {
            setMessage("");

            if (timerEnabled) {
                startCountdown(true);
            }
        } else if (!started) {
            setMessage(
                "Druk op Start om te beginnen."
            );
        }
    }

    function updateFretboardNoteLabels() {
        game
            .querySelectorAll(
                ".fret-note-label"
            )
            .forEach(label => {
                label.remove();
            });

        if (
            notesDisplayMode !== "hidden"
        ) {
            positions.forEach(position => {
                if (
                    position.open ||
                    !shouldShowFretNote(
                        position.note
                    )
                ) {
                    return;
                }

                const label =
                    document.createElement("span");

                label.className =
                    "fret-note-label";

                if (
                    position.note.includes("#")
                ) {
                    label.classList.add("sharp");
                }

                label.textContent =
                    position.note;

                position.element.appendChild(
                    label
                );
            });
        }

        updatePracticeCardMode();
        updateMistakes();
    }

    /* =====================================================
       ANSWER KEYS AND MODES
       ===================================================== */

    function buildAnswerKeys() {
        answerNotes.forEach(item => {
            const button =
                document.createElement("button");

            button.type = "button";
            button.className = "key";
            button.dataset.note = item.note;

            if (
                item.note.includes("#")
            ) {
                button.classList.add("sharp");
            }

            const main =
                document.createElement("span");

            main.className = "note-main";
            main.textContent = item.note;

            const solfege =
                document.createElement("span");

            solfege.className =
                "note-solfege";

            solfege.textContent =
                item.solfege;

            button.append(main, solfege);

            button.addEventListener(
                "click",
                () => {
                    submitAnswer(item.note);
                }
            );

            answerKeys.appendChild(button);
        });
    }

    function updateModeInterface() {
        const natural =
            mode === "natural";

        naturalModeButton.classList.toggle(
            "active",
            natural
        );

        allModeButton.classList.toggle(
            "active",
            !natural
        );

        naturalModeButton.setAttribute(
            "aria-pressed",
            String(natural)
        );

        allModeButton.setAttribute(
            "aria-pressed",
            String(!natural)
        );

        answerKeys
            .querySelectorAll(".key")
            .forEach(button => {
                const sharp =
                    button.dataset.note.includes("#");

                button.disabled =
                    roundFinished ||
                    (
                        !mistakesPracticeMode &&
                        natural &&
                        sharp
                    );
            });

        if (mistakesPracticeMode) {
            hint.textContent =
                `Fouten oefenen · ${activeRoundTotal} probleempositie${activeRoundTotal === 1 ? "" : "s"}`;
        } else {
            hint.textContent =
                natural
                    ? `Ronde van ${totalQuestions} hele noten · open snaar = dubbele rand`
                    : `Ronde van ${totalQuestions} hele en halve noten · open snaar = dubbele rand`;
        }
    }

    function getPositionPool() {
        if (mistakesPracticeMode) {
            return mistakesPracticePool;
        }

        return mode === "natural"
            ? positions.filter(
                position =>
                    naturalNotes.has(
                        position.note
                    )
            )
            : positions;
    }

    /* =====================================================
       QUESTIONS AND ANSWERS
       ===================================================== */

    function clearDot() {
        game
            .querySelectorAll(".dot")
            .forEach(dot => {
                dot.remove();
            });
    }

    function choosePosition(pool) {
        if (!pool.length) {
            return null;
        }

        let candidate;

        do {
            candidate =
                pool[
                    Math.floor(
                        Math.random() *
                        pool.length
                    )
                ];
        } while (
            pool.length > 1 &&
            activePosition &&
            candidate.element ===
                activePosition.element &&
            candidate.midi ===
                activePosition.midi
        );

        return candidate;
    }

    async function showNextQuestion() {
        if (
            !playing ||
            roundFinished ||
            tries >= activeRoundTotal
        ) {
            return;
        }

        clearQuestionTimer();
        stopCountdown(true);
        clearDot();

        answerLocked = false;

        activePosition =
            choosePosition(
                getPositionPool()
            );

        if (!activePosition) {
            return;
        }

        const dot =
            document.createElement("button");

        dot.type = "button";
        dot.className = "dot";

        if (activePosition.open) {
            dot.classList.add("open");
        }

        if (isPracticeCardVisible()) {
            dot.classList.add(
                "practice-hidden"
            );
        }

        dot.addEventListener(
            "click",
            async event => {
                event.stopPropagation();

                await playKarplusStrong(
                    activePosition.midi,
                    activePosition.stringNumber
                );
            }
        );

        activePosition
            .element
            .appendChild(dot);

        setMessage(
            isPracticeCardVisible()
                ? "Bekijk de noten op de hals"
                : "",
            isPracticeCardVisible()
                ? "practice"
                : ""
        );

        await playKarplusStrong(
            activePosition.midi,
            activePosition.stringNumber
        );

        if (
            timerEnabled &&
            !isPracticeCardVisible()
        ) {
            startCountdown(false);
        }
    }

    function submitAnswer(note) {
        if (
            !started ||
            !playing ||
            roundFinished ||
            !activePosition ||
            answerLocked ||
            isPracticeCardVisible()
        ) {
            return;
        }

        if (
            !mistakesPracticeMode &&
            mode === "natural" &&
            note.includes("#")
        ) {
            return;
        }

        answerLocked = true;

        stopCountdown(true);

        tries += 1;

        triesDisplay.textContent =
            String(tries);

        const dot =
            activePosition
                .element
                .querySelector(".dot");

        const correct =
            note === activePosition.note;

        if (correct) {
            score += 1;

            scoreDisplay.textContent =
                String(score);

            if (dot) {
                dot.classList.add("good");
            }

            playCorrectSound();

            setMessage(
                `✓ Juist · ${note}`,
                "correct"
            );
        } else {
            if (dot) {
                dot.classList.add("bad");
            }

            recordMistake(note);
            playWrongSound();

            setMessage(
                `✗ Juiste noot: ${activePosition.note}`,
                "wrong"
            );
        }

        continueOrFinish(
            correct
                ? 700
                : 1050
        );
    }

    /* =====================================================
       START NORMAL ROUND
       ===================================================== */

    async function startNormalRound() {
        await unlockAudio();

        updateRoundSize();

        clearQuestionTimer();
        stopCountdown(true);
        clearDot();

        score = 0;
        tries = 0;

        scoreDisplay.textContent = "0";
        triesDisplay.textContent = "0";

        /*
         * Nieuw spel of Reset wist alle fouten.
         */
        resetMistakes();

        activeRoundTotal =
            totalQuestions;

        started = true;
        playing = true;
        roundFinished = false;
        answerLocked = false;
        activePosition = null;

        roundSize.disabled = true;

        playPauseButton.disabled = false;
        playPauseButton.textContent =
            "⏸ Pause";

        progressBar.classList.remove(
            "complete"
        );

        updateProgress();
        updateStartButton();
        updateModeInterface();

        await showNextQuestion();
    }

    async function startMistakesPractice() {
        mistakesPracticePool =
            buildMistakesPracticePool();

        if (!mistakesPracticePool.length) {
            return;
        }

        await unlockAudio();

        mistakesPracticeMode = true;

        mistakesVisible = false;
        updateMistakes();

        notesDisplayMode = "hidden";
        notesDisplay.value = "hidden";

        updateFretboardNoteLabels();

        clearQuestionTimer();
        stopCountdown(true);
        clearDot();

        score = 0;
        tries = 0;

        scoreDisplay.textContent = "0";
        triesDisplay.textContent = "0";

        activeRoundTotal =
            mistakesPracticePool.length;

        started = true;
        playing = true;
        roundFinished = false;
        answerLocked = false;
        activePosition = null;

        roundSize.disabled = true;

        playPauseButton.disabled = false;
        playPauseButton.textContent =
            "⏸ Pause";

        progressBar.classList.remove(
            "complete"
        );

        updateProgress();
        updateStartButton();
        updateModeInterface();
        updateMistakePracticeButton();

        setMessage(
            `Fouten oefenen · ${activeRoundTotal} probleempositie${activeRoundTotal === 1 ? "" : "s"}`
        );

        await showNextQuestion();
    }

    function stopMistakesPractice() {
        clearQuestionTimer();
        stopCountdown(true);
        clearDot();

        mistakesPracticeMode = false;
        mistakesPracticePool = [];

        playing = false;
        started = false;
        roundFinished = false;
        answerLocked = false;
        activePosition = null;

        score = 0;
        tries = 0;

        scoreDisplay.textContent = "0";
        triesDisplay.textContent = "0";

        activeRoundTotal =
            totalQuestions;

        roundSize.disabled = false;

        playPauseButton.textContent =
            "▶ PLAY";

        progressBar.classList.remove(
            "complete"
        );

        updateProgress();
        updateStartButton();
        updateModeInterface();
        updateMistakePracticeButton();

        setMessage(
            "Fouten oefenen gestopt."
        );
    }

    /* =====================================================
       EVENTS
       ===================================================== */

    roundSize.addEventListener(
        "change",
        updateRoundSize
    );

    roundSize.addEventListener(
        "blur",
        updateRoundSize
    );

    mistakesButton.addEventListener(
        "click",
        () => {
            mistakesVisible =
                !mistakesVisible;

            updateMistakes();
        }
    );

    practiceMistakesButton.addEventListener(
        "click",
        async () => {
            if (mistakesPracticeMode) {
                stopMistakesPractice();
            } else {
                await startMistakesPractice();
            }
        }
    );

    naturalModeButton.addEventListener(
        "click",
        async () => {
            mode = "natural";

            updateModeInterface();

            if (
                started &&
                playing &&
                !roundFinished &&
                !mistakesPracticeMode
            ) {
                await showNextQuestion();
            }
        }
    );

    allModeButton.addEventListener(
        "click",
        async () => {
            mode = "all";

            updateModeInterface();

            if (
                started &&
                playing &&
                !roundFinished &&
                !mistakesPracticeMode
            ) {
                await showNextQuestion();
            }
        }
    );

    notesDisplay.addEventListener(
        "change",
        () => {
            notesDisplayMode =
                notesDisplay.value;

            updateFretboardNoteLabels();
        }
    );

    timerToggle.addEventListener(
        "click",
        () => {
            timerEnabled =
                !timerEnabled;

            remainingTimeMs = null;

            updateTimerInterface();
        }
    );

    timerSeconds.addEventListener(
        "change",
        () => {
            remainingTimeMs = null;

            if (
                timerEnabled &&
                started &&
                playing &&
                !answerLocked &&
                !isPracticeCardVisible()
            ) {
                startCountdown(false);
            }
        }
    );

    playPauseButton.addEventListener(
        "click",
        async () => {
            if (!started) {
                setMessage(
                    "Druk eerst op Start."
                );

                return;
            }

            if (roundFinished) {
                setMessage(
                    mistakesPracticeMode
                        ? "De foutenoefening is voltooid."
                        : "Druk op Start voor een nieuwe ronde."
                );

                return;
            }

            await unlockAudio();

            if (playing) {
                playing = false;

                playPauseButton.textContent =
                    "▶ PLAY";

                if (timerEnabled) {
                    pauseCountdown();
                }

                setMessage("Gepauzeerd");
                return;
            }

            playing = true;

            playPauseButton.textContent =
                "⏸ Pause";

            updatePracticeCardMode();

            if (activePosition) {
                await playKarplusStrong(
                    activePosition.midi,
                    activePosition.stringNumber
                );

                if (
                    timerEnabled &&
                    !answerLocked &&
                    !isPracticeCardVisible()
                ) {
                    startCountdown(true);
                }
            } else {
                await showNextQuestion();
            }
        }
    );

    startButton.addEventListener(
        "click",
        startNormalRound
    );

    window.addEventListener(
        "keydown",
        event => {
            if (event.repeat) {
                return;
            }

            if (event.code === "Space") {
                event.preventDefault();
                playPauseButton.click();
                return;
            }

            if (
                !started ||
                !playing ||
                roundFinished ||
                isPracticeCardVisible()
            ) {
                return;
            }

            const key =
                event.key.toUpperCase();

            if (
                "ABCDEFG".includes(key)
            ) {
                submitAnswer(key);
            }
        }
    );

    /* =====================================================
       INITIALIZE
       ===================================================== */

    buildFretboard();
    buildAnswerKeys();

    updateRoundSize();
    updateModeInterface();
    updateTimerInterface();
    updateFretboardNoteLabels();
    updateMistakes();
    updateProgress();
    updateStartButton();

    setMessage(
        "Druk op Start om te beginnen."
    );

    soundStatus.textContent =
        "Geluid start zodra je op Start drukt.";
})();
</script>
